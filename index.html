function getVisible(){
  const tf=CTR.adultos+CTR.criancas+CTR.jovens;
  return QS.filter(q=>{
    if(q.conditional==='p5_notSolo') return tf>0;
    return true;
  });
}

function renderQ(){
  const vis=getVisible(),q=vis[step];
  if(!q){renderResults();return;}
  const total=vis.length,pct=Math.round((step/total)*100),keys=['A','B','C','D','E','F','G'];
  const isLast=step===total-1;
  const app=document.getElementById('app');
  const cor=T==='de'?'#D4AF37':'#173528';

  /* FIX THAÍS: badge visível quando usuário já está no destino */
  const badgeDestino=isNoDestino()
    ? `<div style="text-align:center;margin-bottom:8px"><span class="destino-badge ${T}"><span class="destino-badge-dot"></span>Você já está ${T==='de'?'na Alemanha':'na Austrália'} · perguntas adaptadas</span></div>`
    : '';

  const wrap=document.createElement('div');
  wrap.innerHTML=`
    ${badgeDestino}
    <div style="text-align:center;padding:${isNoDestino()?'8px':'20px'} 0 16px">
      <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:${cor}">${T==='de'?'Alemanha':'Austrália'} · Pergunta ${step+1} de ${total}</div>
    </div>
    <div class="prog-wrap">
      <div class="prog-meta"><span style="opacity:0">&nbsp;</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill ${T}" style="width:${pct}%"></div></div>
    </div>`;

  const card=document.createElement('div');card.className='q-card';
  card.innerHTML=`<div class="q-text">${q.q}</div>`;
  if(q.hint) card.innerHTML+=`<div class="q-hint">${q.hint}</div>`;

  if(q.familyQ){
    const intro=document.createElement('div');intro.className='fam-intro';
    intro.innerHTML=isNoDestino()?`Informe quantas pessoas vieram com você. Se veio sozinho(a), toque em <strong>Continuar sozinho(a)</strong> abaixo.`:`Informe quantas pessoas vão com você. Se vai sozinho(a), toque em <strong>Continuar sozinho(a)</strong> abaixo.`;
    card.appendChild(intro);
    const grid=document.createElement('div');grid.className='fam-grid';
    q.ctrs.forEach(ct=>{
      const row=document.createElement('div');row.className='fam-row';
      row.innerHTML=`<div><div class="fam-lbl">${ct.l}</div><div class="fam-sub">${ct.s}</div></div><div class="fam-ctrl"><button class="fam-btn" id="fm-${ct.k}">-</button><div class="fam-val" id="fv-${ct.k}">${CTR[ct.k]}</div><button class="fam-btn" id="fp-${ct.k}">+</button></div>`;
      grid.appendChild(row);
    });
    card.appendChild(grid);
    const totalEl=document.createElement('div');totalEl.className='fam-total';totalEl.id='fam-total';
    const tf=CTR.adultos+CTR.criancas+CTR.jovens;
    totalEl.textContent=tf>0?`${tf} dependente${tf>1?'s':''} informado${tf>1?'s':''}`:'';
    card.appendChild(totalEl);
  } else if(q.selectQ){
    const wrapSel=document.createElement('div');wrapSel.style.cssText='position:relative';
    const sel=document.createElement('select');
    sel.id='sel-'+q.id;
    sel.style.cssText='width:100%;padding:14px 40px 14px 16px;border:1px solid #30304a;border-radius:var(--r2);font-size:15px;color:var(--text);background:#111120;font-family:Geist,sans-serif;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color .2s';
    const placeholder=document.createElement('option');
    placeholder.value='';placeholder.textContent=q.placeholder||'Selecione...';placeholder.disabled=true;
    const currentVal=ANS[q.id]?ANS[q.id].v:'';
    placeholder.selected=!currentVal;
    sel.appendChild(placeholder);
    q.selectOpts.forEach(o=>{
      const opt=document.createElement('option');
      opt.value=o.v;opt.textContent=o.l;
      if(currentVal===o.v) opt.selected=true;
      sel.appendChild(opt);
    });
    const arrow=document.createElement('span');
    arrow.style.cssText='position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none;font-size:12px';
    arrow.textContent='▼';
    wrapSel.appendChild(sel);wrapSel.appendChild(arrow);
    card.appendChild(wrapSel);
    sel.addEventListener('change',()=>{
      const v=sel.value;
      const l=q.selectOpts.find(o=>o.v===v)?.l||v;
      ANS[q.id]={v,l};
      sel.style.borderColor=T==='de'?'#D4AF37':'#173528';
      setTimeout(()=>{
        if(!isLast){step++;renderQ();window.scrollTo(0,0);}
        else{const nb=document.getElementById('btn-next');if(nb)nb.disabled=false;}
      },300);
    });
  } else {
    const od=document.createElement('div');od.className='opts';
    q.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'+(ANS[q.id]&&ANS[q.id].v===o.v?' sel '+T:'');
      b.innerHTML=`<span class="opt-key">${keys[i]}</span><span class="opt-lbl">${o.l}</span>`;
      b.addEventListener('click',()=>{
        ANS[q.id]={v:o.v,l:o.l};
        logEvent('question_answered',{question_id:q.id,answer_value:o.v,answer_label:o.l});
        od.querySelectorAll('.opt').forEach(x=>{x.className='opt';});
        b.className='opt sel '+T;
        if(!isLast){step++;renderQ();window.scrollTo(0,0);}
        else{const nb=document.getElementById('btn-next');if(nb)nb.disabled=false;}
      });
      od.appendChild(b);
    });
    card.appendChild(od);
  }
  wrap.appendChild(card);

  const nav=document.createElement('div');nav.className='nav';
  if(step>0){
    const bk=document.createElement('button');bk.className='btn-back';bk.innerHTML='&#8592;';
    bk.addEventListener('click',()=>{step=Math.max(0,step-1);renderQ();window.scrollTo(0,0);});
    nav.appendChild(bk);
  }
  if(q.familyQ){
    const btnSolo=document.createElement('button');btnSolo.className=`btn-next ${T}`;
    btnSolo.style.background='var(--border2)';btnSolo.style.color='var(--text)';
    btnSolo.textContent='Continuar sozinho(a)';
    btnSolo.addEventListener('click',()=>{
      ANS['p5']={v:'solo',l:'Sozinho(a)'};CTR={adultos:0,criancas:0,jovens:0};
      step++;renderQ();window.scrollTo(0,0);
    });
    const btnDep=document.createElement('button');btnDep.className=`btn-next ${T}`;btnDep.id='btn-dep';
    btnDep.textContent='Confirmar dependentes';
    const tf2=CTR.adultos+CTR.criancas+CTR.jovens;
    btnDep.style.display=tf2>0?'block':'none';
    btnDep.addEventListener('click',()=>{
      ANS['p5']={v:'familia',l:'Com dependentes'};
      step++;renderQ();window.scrollTo(0,0);
    });
    nav.appendChild(btnSolo);nav.appendChild(btnDep);
  } else if(isLast){
    const nx=document.createElement('button');nx.id='btn-next';nx.className=`btn-next ${T}`;
    nx.textContent='Ver minha pontuação';nx.disabled=!ANS[q.id];
    nx.addEventListener('click',()=>{if(!ANS[q.id])return;logEvent('lead_gate_view',{questions_answered:Object.keys(ANS).length});renderLeadGate();window.scrollTo(0,0);});
    nav.appendChild(nx);
  }
  wrap.appendChild(nav);
  app.innerHTML='';app.appendChild(wrap);

  if(q.familyQ){
    q.ctrs.forEach(ct=>{
      const minus=document.getElementById('fm-'+ct.k),plus=document.getElementById('fp-'+ct.k),valEl=document.getElementById('fv-'+ct.k);
      const update=()=>{
        if(valEl)valEl.textContent=CTR[ct.k];
        const tf=CTR.adultos+CTR.criancas+CTR.jovens;
        const tot=document.getElementById('fam-total');
        if(tot)tot.textContent=tf>0?`${tf} dependente${tf>1?'s':''} informado${tf>1?'s':''}`:'';
        const bd=document.getElementById('btn-dep');if(bd)bd.style.display=tf>0?'block':'none';
      };
      if(minus)minus.addEventListener('click',()=>{CTR[ct.k]=Math.max(0,CTR[ct.k]-1);update();});
      if(plus) plus.addEventListener('click',()=>{CTR[ct.k]++;update();});
    });
  }
}

function getPrimaryCta(result,band){
  return buildMotorDrivenPrimaryCta(result,band) || getFallbackPrimaryCta(result,band);
}

function shouldOfferDossierIntake(result,motorDecision){
  if(result.final < 55) return false;
  return !(motorDecision&&['Lite','Completo'].includes(motorDecision.status));
}

function getDossierIntakeTone(rawDecision,motorSource){
  if(rawDecision&&rawDecision.decision&&rawDecision.decision.status==='Faltam dados'){
    return {
      title:'Faltam poucos dados para liberar a recomendação certa',
      copy:'O diagnóstico base já foi feito. Agora responda a triagem curta abaixo e confirme se já tem um CV atual para enviar.'
    };
  }
  if(rawDecision&&rawDecision.decision&&rawDecision.decision.status==='Recusa'){
    return {
      title:'Seu caso ainda não libera o Dossiê automaticamente',
      copy:'Isso não significa “fim de linha”. Significa só que ainda falta base ou clareza para uma decisão séria. Se quiser, refine a triagem abaixo.'
    };
  }
  if(motorSource==='awaiting_intake'){
    return {
      title:'Destrave uma leitura premium do seu caso',
      copy:'O quiz já fez a leitura base. Esta triagem adiciona o contexto que falta para transformar um resultado genérico em uma recomendação mais séria, estratégica e acionável.'

  }
  return {
    title:'Se quiser um próximo passo mais preciso, complete a triagem curta',
    copy:'Ela existe para reduzir chute e evitar te mandar para o CTA errado.'
  };
}

    {

function isInterviewAnswerValid(question,value){
  if(!question) return false;
  if(question.type==='select') return dossierHasText(value);
  return dossierHasText(value,question.minLength||1);
}

function getInterviewProgress(decision,motorInput,state){
  const questions=getDossierInterviewQuestions(decision,motorInput,state).filter(question=>!question.condition||question.condition(state||{}));
  const answered=questions.filter(question=>isInterviewAnswerValid(question,getInterviewResolvedValue(question,state,motorInput))).length;
  return {questions,answered,total:questions.length};
}

function getNextInterviewQuestion(decision,motorInput,state){
  const progress=getInterviewProgress(decision,motorInput,state);
  return progress.questions.find(question=>!isInterviewAnswerValid(question,getInterviewResolvedValue(question,state,motorInput)))||null;
}

function formatInterviewAnswer(question,value){
  if(!question) return esc(String(value||''));
  if(question.type==='select'){
    const option=(question.options||[]).find(item=>item.value===value);
    return esc(option?option.label:value||'');
  }
  return esc(String(value||'').trim());
}

function buildPreviewIdentityContext(motorInput,interviewState){
  const questionnaire=motorInput&&motorInput.questionnaire&&typeof motorInput.questionnaire==='object'?motorInput.questionnaire:{};
  const answers=interviewState&&interviewState.answers&&typeof interviewState.answers==='object'?interviewState.answers:{};
  const cvSnapshot=getInterviewResolvedValue({id:'cv_snapshot',type:'textarea',minLength:1},interviewState,motorInput)||'';
  const currentPositioning=getInterviewResolvedValue({id:'current_positioning',type:'text',minLength:1},interviewState,motorInput)||'';
  const targetPositioning=getInterviewResolvedValue({id:'target_positioning',type:'textarea',minLength:1},interviewState,motorInput)||'';
  const cvDomain=inferCareerDomain(`${cvSnapshot} ${currentPositioning}`);
  const targetDomain=inferCareerDomain(`${targetPositioning} ${(questionnaire.target_role_hypotheses||[]).join(' ')}`);
  const inferredArea=cvDomain?cvDomain.label:(ANS['p3']?ANS['p3'].l:'Área não informada');
  return {
    cvSnapshot,
    cvDomain,
    targetDomain,
    inferredArea,
    cvSummary:summarizeCvSnapshot(cvSnapshot),
    cvHeadline:truncateText(extractCvHeadline(cvSnapshot)||currentPositioning||'',140),
    cvMetrics:extractCvMetricSnippets(cvSnapshot,3)
  };
}

function buildDossierPreview(result,band,decision,motorInput,interviewState){
  const questionnaire=motorInput&&motorInput.questionnaire&&typeof motorInput.questionnaire==='object'?motorInput.questionnaire:{};

  const identity=buildPreviewIdentityContext(motorInput,interviewState);
  const answers=interviewState&&interviewState.answers&&typeof interviewState.answers==='object'?interviewState.answers:{};

function exportDossierPreviewPdf(result,band,decision,motorInput,interviewState){
  const html=renderPreviewPdfDocument(result,band,decision,motorInput,interviewState);
  try{
    const popup=window.open('','_blank','noopener,noreferrer');
    if(popup&&popup.document){
      popup.document.open();
      popup.document.write(html);
      popup.document.close();
      popup.focus();
      return true;
    }
  }catch(e){}
  try{
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.target='_blank';
    link.rel='noopener noreferrer';
    link.style.display='none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.__CIA_LAST_DOSSIER_PDF_URL__=url;
    setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},60000);
    return true;
  }catch(e){
    return false;
  }
}

function isDossierCtaInlinePrimary(cta){
  return !!cta&&['dossier_intake_start','dossier_request_complement'].includes(cta.id);
}

function shouldRenderDossierWorkspaceLaunch(result,rawDecision){
  const summary=getMotorDecisionSummary(rawDecision);
  return shouldOfferDossierIntake(result,summary)||!!(summary&&['Lite','Completo'].includes(summary.status));
}

function renderDossierWorkspaceLaunchCard(result,band,rawDecision,motorSource){
  if(!shouldRenderDossierWorkspaceLaunch(result,rawDecision)) return '';
  const summary=getMotorDecisionSummary(rawDecision);
  const needsInterview=!!(summary&&['Lite','Completo'].includes(summary.status));
  const mode=needsInterview?'interview':'intake';
  const title=needsInterview
    ? (summary.status==='Lite'?'Abrir área dedicada do Dossiê Lite':'Abrir área dedicada do Dossiê Completo')
    : 'Abrir área dedicada da triagem estratégica';
  const copy=needsInterview
    ? 'O score já cumpriu o papel dele. A partir daqui, o dossiê precisa de um espaço próprio para coleta de contexto, entrevista e prévia.'
    : 'O quiz encerrou a leitura base. A próxima decisão do motor não deve ficar espremida dentro do cartão de resultado.';
  const label=needsInterview?'Abrir dossiê em tela dedicada':'Abrir triagem em tela dedicada';
  const kicker=needsInterview?'Fluxo do dossiê':'Triagem estratégica';
  const note=needsInterview
    ? 'Melhor do que continuar no card do resultado: você entra direto na parte que gera contexto para o dossiê.'
    : 'Abre em aba separada com o contexto do resultado preservado.';
  return `<div class="primary-cta" data-dossier-workspace-launch="${mode}">
    <div class="primary-cta-kicker">${kicker}</div>
    <div class="primary-cta-title">${title}</div>
    <div class="primary-cta-copy">${copy}</div>
    <button type="button" class="primary-cta-btn ${T==='de'?'de':'au'}" data-dossier-workspace-open="${mode}">${label}</button>
    <div class="primary-cta-note">${note}</div>
  </div>`;
}

function bindDossierIntakeCard(result,band){
  const card=document.getElementById('dossier-intake-card');
  if(!card) return;
  const toggle=document.getElementById('dossier-intake-toggle');
  const wrap=document.getElementById('dossier-intake-form-wrap');
  const errorEl=document.getElementById('dossier-intake-error');
  const statusEl=document.getElementById('dossier-intake-status');
  const submitBtn=document.getElementById('dossier-intake-submit');
  if(toggle&&wrap){
    toggle.addEventListener('click',()=>{
      const open=wrap.style.display!=='none';
      wrap.style.display=open?'none':'block';
      toggle.textContent=open?'Completar triagem estratégica':'Fechar triagem estratégica';
    });
  }
  if(!submitBtn) return;
  submitBtn.addEventListener('click',async()=>{
    const seniority=(document.getElementById('dossier-seniority')||{}).value||'';
    const availability=(document.getElementById('dossier-availability')||{}).value||'';
    const urgency=(document.getElementById('dossier-urgency')||{}).value||'';
    const goal=((document.getElementById('dossier-goal')||{}).value||'').trim();
    const marketLogic=((document.getElementById('dossier-market-logic')||{}).value||'').trim();
    const evidence=((document.getElementById('dossier-results-evidence')||{}).value||'').trim();
    const referenceOpportunity=((document.getElementById('dossier-reference-opportunity')||{}).value||'').trim();
    const rolesRaw=((document.getElementById('dossier-target-roles')||{}).value||'').trim();
    const targetRoles=rolesRaw.split(/[,\n]/).map(v=>v.trim()).filter(Boolean);
    const languageLevelDetail=T==='de'
      ? (ANS['p2']?ANS['p2'].l:'Alemão ainda não informado')
      : (ANS['p1']?ANS['p1'].l:'Inglês ainda não informado');
    const languageStructuralBlock=T==='de'
      ? !((ANS['p2']?ANS['p2'].v:0) >= 2)
      : !((ANS['p1']?ANS['p1'].v:0) >= 2);
    const materials={
      cv:!!((document.getElementById('dossier-cv')||{}).checked),
      linkedin:!!((document.getElementById('dossier-linkedin')||{}).checked),
      portfolio:!!((document.getElementById('dossier-portfolio')||{}).checked),
      github:!!((document.getElementById('dossier-github')||{}).checked)
    };
    const questionnaire={
      goal_for_next_12_months: goal,
      target_market_logic: marketLogic,
      evidence_of_results: evidence,
      language_level_detail: languageLevelDetail,
      reference_opportunity: referenceOpportunity,
      availability_for_execution: availability,
      urgency_window: urgency,
      target_role_hypotheses: targetRoles,
      has_meaningful_tradeoffs: !!((document.getElementById('dossier-tradeoffs')||{}).checked),
      high_ambiguity_case: false,
      story_inconsistent: false,
      language_structural_block: languageStructuralBlock
    };
    const errors=[];
    if(!seniority) errors.push('Selecione sua senioridade.');
    if(!availability) errors.push('Selecione sua disponibilidade.');
    if(!urgency) errors.push('Selecione seu prazo.');
    if(!materials.cv) errors.push('Antes de continuar, confirme que você já tem um CV atual para enviar.');
    if(goal.length<12) errors.push('Explique melhor seu objetivo para os próximos 12 meses.');
    if(marketLogic.length<12) errors.push('Explique mercado principal e alternativas reais.');
    if(evidence.length<12) errors.push('Traga pelo menos uma evidência concreta de resultado.');
    if(referenceOpportunity.length<6) errors.push('Informe uma vaga de referência ou diga explicitamente que ainda não mapeou nenhuma.');
    if(targetRoles.length<1) errors.push('Informe ao menos uma hipótese de cargo-alvo.');
    if(targetRoles.length>3) errors.push('Informe no máximo 3 cargos-alvo.');
    if(errors.length){
      if(errorEl){errorEl.style.display='block';errorEl.textContent=errors[0];}
      if(statusEl) statusEl.textContent='A triagem ainda está incompleta.';
      return;
    }
    if(errorEl){errorEl.style.display='none';errorEl.textContent='';}
    if(statusEl) statusEl.textContent='Atualizando recomendação...';
    submitBtn.disabled=true;
    submitBtn.textContent='Processando...';
    clearMotorDecision();
    clearDossierFlowState();
    const motorInput={
      profile:{seniority_level:seniority},
      materials,
      questionnaire,
      meta:{submitted_at:new Date().toISOString(),source:'cia_real_intake'}
    };
    storeMotorInput(motorInput);
    const intakeRecord=buildDossierIntakeRecord(result,band,motorInput);
    if(intakeRecord) supabaseInsert('dossierIntakes', intakeRecord);
    logEvent('dossier_intake_submitted',{
      intake_source:'cia_real_intake',
      dossier_fields:{
        seniority: seniority,
        availability: availability,
        urgency: urgency,
        target_roles_count: targetRoles.length,
        has_cv: materials.cv,
        has_linkedin: materials.linkedin,
        has_portfolio: materials.portfolio,
        has_github: materials.github
      }
    });
    const nextResolution=await requestMotorDecision(result,band);
    const nextDecision=nextResolution&&nextResolution.decision?nextResolution.decision:getStoredMotorDecision();
    const nextSummary=getMotorDecisionSummary(nextDecision);
    if(isDossierWorkspaceHash()){
      storeDossierWorkspaceContext(buildDossierWorkspaceContext(result,band,nextDecision,nextResolution&&nextResolution.source?nextResolution.source:'workspace'));
      if(nextSummary&&['Lite','Completo'].includes(nextSummary.status)){
        replaceHashSilently('#dossier-interview');
        renderDossierWorkspace('interview');
      }else{
        replaceHashSilently('#dossier-intake');
        renderDossierWorkspace('intake');
      }
      window.scrollTo({top:0,behavior:'smooth'});
      return;
    }
    await renderResults({skipAnalytics:true});
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

function bindDossierInterviewCard(result,band,rawDecision){
  const card=document.getElementById('dossier-interview-card');
  if(!card) return;
  const decision=getMotorDecisionSummary(rawDecision);
  if(!decision) return;
  const unlockBtn=document.getElementById('dossier-fulfillment-unlock');
  if(unlockBtn){
    unlockBtn.addEventListener('click',async()=>{
      storeDossierFulfillment({
        mode:'qa_simulated_purchase',
        decision_status:decision.status,
        unlockedAt:new Date().toISOString()
      });
      logEvent('dossier_fulfillment_unlocked',{
        mode:'qa_simulated_purchase',
        decision_status:decision.status
      });
      if(isDossierWorkspaceHash()){
        renderDossierWorkspace('interview');
        window.scrollTo({top:0,behavior:'smooth'});
        return;
      }
      await renderResults({skipAnalytics:true});
      const anchor=document.getElementById('dossier-interview-card');
      if(anchor) anchor.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
  if(!isDossierFulfillmentUnlocked()) return;
  const motorInput=getStoredMotorInput()||{};
  const state=getStoredDossierInterview()||{answers:{},confirmed:false,startedAt:null};
  const nextQuestion=getNextInterviewQuestion(decision,motorInput,state);
  const submitBtn=document.getElementById('dossier-interview-submit');
  const confirmBtn=document.getElementById('dossier-interview-confirm');
  const resetBtn=document.getElementById('dossier-interview-reset');
  const exportBtns=Array.from(document.querySelectorAll('[data-dossier-export-pdf]'));
  const errorEl=document.getElementById('dossier-interview-error');
  if(submitBtn&&nextQuestion){
    submitBtn.addEventListener('click',async()=>{
      const inputEl=document.getElementById('dossier-interview-answer');
      const value=inputEl&&typeof inputEl.value==='string'?inputEl.value.trim():'';
      if(!isInterviewAnswerValid(nextQuestion,value)){
        if(errorEl){
          errorEl.style.display='block';
          errorEl.textContent=nextQuestion.type==='select'?'Selecione uma opção antes de continuar.':`Responda com um pouco mais de substância para eu não gerar um dossiê raso.`;
        }
        return;
      }
      const nextState={
        answers:{...(state.answers||{}),[nextQuestion.id]:value},
        confirmed:false,
        startedAt:state.startedAt||new Date().toISOString(),
        updatedAt:new Date().toISOString()
      };
      storeDossierInterview(nextState);
      logEvent('dossier_interview_answered',{
        decision_status:decision.status,
        question_id:nextQuestion.id,
        answer_length:value.length
      });
      if(isDossierWorkspaceHash()){
        renderDossierWorkspace('interview');
        window.scrollTo({top:0,behavior:'smooth'});
        return;
      }
      await renderResults({skipAnalytics:true});
      const anchor=document.getElementById('dossier-interview-card');
      if(anchor) anchor.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
  if(confirmBtn){
    confirmBtn.addEventListener('click',async()=>{
      if(!state.confirmed){
        const nextState={...state,confirmed:true,confirmedAt:new Date().toISOString()};
        storeDossierInterview(nextState);
        logEvent('dossier_preview_generated',{
          decision_status:decision.status,
          question_count:getInterviewProgress(decision,motorInput,nextState).answered
        });
        if(isDossierWorkspaceHash()){
          renderDossierWorkspace('interview');
          window.scrollTo({top:0,behavior:'smooth'});
          return;
        }
        await renderResults({skipAnalytics:true});
      }
      const anchor=document.getElementById('dossier-interview-card');
      if(anchor) anchor.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
  if(resetBtn){
    resetBtn.addEventListener('click',async()=>{
      clearDossierFlowState();
      if(isDossierWorkspaceHash()){
        renderDossierWorkspace('intake');
        window.scrollTo({top:0,behavior:'smooth'});
        return;
      }
      await renderResults({skipAnalytics:true});
      const anchor=document.getElementById('dossier-interview-card');
      if(anchor) anchor.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
  if(exportBtns.length&&state.confirmed){
    exportBtns.forEach((exportBtn)=>{
      exportBtn.addEventListener('click',()=>{
        exportDossierPreviewPdf(result,band,decision,motorInput,state);
      });
    });
  }
}

          <div class="cia-topbar-spacer" aria-hidden="true"></div>
          <div class="cia-brand">
            <div class="cia-brand-name">CIA App</div>
            <div class="cia-brand-sub">Elite Migration</div>
          </div>
          <div class="cia-topbar-spacer" aria-hidden="true"></div>
        </div>
        <div class="primary-cta" style="margin-top:28px">
          <div class="primary-cta-kicker">Área do dossiê</div>
          <div class="primary-cta-title">Não encontrei o contexto desta sessão</div>
          <div class="primary-cta-copy">Abra a área do dossiê a partir do resultado do quiz para preservar score, trilha e decisão do motor.</div>
          <button type="button" id="btn-dossier-home" class="primary-cta-btn ${T==='de'?'de':'au'}">Voltar ao app</button>
        </div>
      </div>`;
    const homeBtn=document.getElementById('btn-dossier-home');
    if(homeBtn) homeBtn.addEventListener('click',()=>{replaceHashSilently('');renderTrilha();window.scrollTo(0,0);});
    return;
  }
  restoreDossierWorkspaceGlobals(context);
  const result=context.result||calcScore();
  const band=context.band||getBand(result.final);
  const rawDecision=context.rawDecision||getStoredMotorDecision();
  const summary=getMotorDecisionSummary(rawDecision);
  const effectiveMode=(mode==='interview'&&summary&&['Lite','Completo'].includes(summary.status))?'interview':'intake';
  const title=effectiveMode==='interview'
    ? (summary&&summary.status==='Lite'?'Dossiê Lite · área dedicada':'Dossiê Completo · área dedicada')
    : 'Triagem estratégica · área dedicada';
  const copy=effectiveMode==='interview'
    ? 'Aqui o motor vira entrega: contexto, entrevista adaptativa e prévia do dossiê sem disputar espaço com a tela de score.'
    : 'Aqui o motor decide o tier do dossiê com mais calma, usando a triagem curta antes de qualquer geração de conteúdo.';
  const cardHtml=effectiveMode==='interview'
    ? renderDossierInterviewCard(result,band,rawDecision)
    : renderDossierIntakeCard(result,rawDecision,context.motorSource||'workspace');
  document.getElementById('app').innerHTML=`
    <div class="trilha-wrap">
      <div class="cia-topbar">
        <div class="cia-topbar-spacer" aria-hidden="true"></div>
        <div class="cia-brand">
          <div class="cia-brand-name">CIA App</div>
          <div class="cia-brand-sub">Elite Migration</div>
        </div>
        <div class="cia-topbar-spacer" aria-hidden="true"></div>
      </div>
      <div style="text-align:center;padding:24px 0 10px">
        <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:${T==='de'?'#D4AF37':'#173528'}">Mecanismo do dossiê</div>
        <div style="font-family:'DM Serif Display',serif;font-size:clamp(30px,6vw,42px);line-height:1.12;color:#F7F3EA;margin:10px auto 12px;max-width:520px">${title}</div>
        <div style="font-size:14px;color:var(--text2);line-height:1.75;max-width:560px;margin:0 auto">${copy}</div>
      </div>
      <div style="display:flex;justify-content:center;margin:8px 0 18px">
        <button type="button" id="btn-dossier-back-result" class="market-back">Voltar ao resultado</button>
      </div>
      ${cardHtml}
    </div>`;
  const backBtn=document.getElementById('btn-dossier-back-result');
  if(backBtn){
    backBtn.addEventListener('click',async()=>{
      replaceHashSilently('');
      await renderResults({skipAnalytics:true});
      window.scrollTo(0,0);
    });
  }
  bindDossierIntakeCard(result,band);
  bindDossierInterviewCard(result,band,rawDecision);
}

async function renderResults(opts={}){
  const skipAnalytics=!!opts.skipAnalytics;
  const result=calcScore(),band=getBand(result.final),alerts=getAlerts(),insights=getInsights(result),steps=getSteps(result);
  const motorResolution=await requestMotorDecision(result,band);
  const motorDecision=getMotorDecisionSummary(motorResolution.decision);
  const primaryCta=getPrimaryCta(result,band);
  const inlineDossierPrimary=isDossierCtaInlinePrimary(primaryCta);

  GEO.pais=GEO.pais||'Brasil';
  publicLeadId();
  const resultPayload={
    session_id:SESSION_ID,
    lead_id:LEAD._id,
    trilha:T,score:result.final,banda:band.lb,
    d1:result.dims.d1,d2:result.dims.d2,d3:result.dims.d3,d4:result.dims.d4,
    pais_atual:GEO.paisLabel||GEO.pais||'Brasil',tempo_fora:GEO.tempoLabel||GEO.tempo||'',area:ANS['p3']?ANS['p3'].l:'',ingles:ANS['p1']?ANS['p1'].l:'',
    alemao:ANS['p2']?ANS['p2'].l:'',diploma:ANS['p4']?ANS['p4'].l:'',
    prazo:ANS['p8']?ANS['p8'].l:'',investimento:ANS['p9']?ANS['p9'].l:'',
    motor_decision_status:motorDecision?motorDecision.status:null,
    motor_recommended_offer:motorDecision?motorDecision.recommendedOffer:null,
    motor_next_step:motorDecision?motorDecision.nextStep:null,
    motor_decision_source:motorResolution.source||null,
    dependentes:CTR.adultos+CTR.criancas+CTR.jovens,
    criancas:CTR.criancas,jovens:CTR.jovens,
    answers:ANS,counters:CTR,alerts:alerts.map(a=>a.text),insights:insights.map(i=>({cat:i.cat,title:i.title})),
    created_at:new Date().toISOString()
  };
  if(!skipAnalytics){
    logEvent('quiz_complete',resultPayload);
    supabaseInsert('results',resultPayload);
  }

  const circ=2*Math.PI*80,off=circ-(result.final/100)*circ;
  const wrap=document.createElement('div');wrap.className='res';
  wrap.innerHTML=`
    <div style="text-align:center;padding:20px 0 8px">
      <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:${T==='de'?'#D4AF37':'#173528'}">${T==='de'?'Alemanha':'Austrália'} · Resultado</div>
    </div>
    <div class="score-hero">
      <div class="score-ring-wrap">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle cx="95" cy="95" r="80" fill="none" stroke="#1c1c2e" stroke-width="8"/>
          <circle cx="95" cy="95" r="80" fill="none" stroke="${band.col}" stroke-width="8"
            stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${circ.toFixed(2)}"
            stroke-linecap="round" transform="rotate(-90 95 95)" id="score-ring"/>
        </svg>
        <div class="score-num-wrap">
          <div class="score-big" id="score-n">0</div>
          <div class="score-of">DE 100</div>
        </div>
      </div>
      <div id="score-band-txt" class="score-band-pill" style="color:${band.col};border-color:${band.col}20;background:${band.col}12;transition:opacity .4s ease,transform .4s ease">${band.lb}</div>
      <div class="score-desc" id="score-desc-txt" style="transition:opacity .5s ease">${band.desc}</div>
    </div>
    <div class="sec-label-main">Pontuação por dimensão</div>
    <div class="dims">
      ${[
        {k:'d1',l:'Idioma e área',c:'#6e8ef7'},
        {k:'d2',l:'Maturidade da decisão',c:'#f0c44a'},
        {k:'d3',l:'Perfil comportamental',c:'#3ecf8e'},
        {k:'d4',l:'Conhecimento do mercado',c:'#a98ef7'}
      ].map(d=>`<div class="dim-bar-wrap">
        <div class="dim-bar-header">
          <span class="dim-bar-name">${d.l}</span>
          <span class="dim-bar-score">${result.dims[d.k]}/100</span>
        </div>
        <div class="dim-bar-track"><div class="dim-bar-fill" id="bar-${d.k}" style="width:0%;background:${d.c}"></div></div>
      </div>`).join('')}
    </div>
    <div style="font-size:13px;color:var(--text2);text-align:center;line-height:1.7;margin:16px 0 8px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r2)">Conteúdo educacional. Não substitui assessoria jurídica, de imigração ou financeira. ${T==='au'?'Consulte um agente MARA registrado.':'Consulte uma consultoria de imigração credenciada.'}</div>
    ${alerts.length?`<div class="sec-label-main">Atenção</div><div class="alert-wrap">${alerts.map(al=>`<div class="alert-card ${al.type}"><div class="alert-dot"></div><div class="alert-text">${al.text}</div></div>`).join('')}</div>`:``}
    <div class="sec-label-main" style="margin:24px 0 12px">Análise do seu perfil</div>
    ${(()=>{
      let html='';
      let d2count=0;
      const d2cards=insights.filter(i=>i.cat==='d2'||i.cat==='familia'||i.cat==='financeiro');
      const manyD2=d2cards.length>2;
      insights.forEach((i,idx)=>{
        html+=`<div class="ins-card" style="border-left-color:${INS_COLORS[i.cat]||'#5b9cf6'}" data-idx="${idx}">
          <div class="ins-title">${i.title}<span class="ins-title-chevron">▼</span></div>
          <div class="ins-text">${i.text}</div>
        </div>`;
      });

      return html;
    })()}
    <div class="sec-label-main" style="margin-top:24px">Próximos passos</div>
    <div class="steps">${steps.map((s,i)=>`<div class="step"><span class="step-n">0${i+1}</span><div class="step-t">${s}</div></div>`).join('')}</div>
    ${inlineDossierPrimary?renderDossierWorkspaceLaunchCard(result,band,motorResolution.decision,motorResolution.source):renderPrimaryCta(result,band)}
    ${inlineDossierPrimary?'':renderDossierWorkspaceLaunchCard(result,band,motorResolution.decision,motorResolution.source)}
    <div class="secondary-resources-label" id="email-report-note">Entrega conectada ao diagnóstico</div>
    <div style="background:#0d0d1a;border:1px solid var(--border);border-radius:var(--r);padding:18px 18px 16px;margin:8px 0 18px">
      <div style="font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px">Este MVP está testando coerência de motor, não viralização</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.7">Seu resultado já fica ligado ao nome, email e WhatsApp que você confirmou. A lógica agora é validar se o diagnóstico, a triagem estratégica e a recomendação seguinte fazem sentido em conjunto. Por isso, a continuidade principal deste MVP acontece pela trilha conectada ao seu resultado, não por botões de compartilhamento.</div>
    </div>
    ${result.final>=86?`<div class="secondary-resources-label">Interesse premium registrado pelo CTA principal</div>`:''}
    <div class="social" style="display:flex;flex-direction:column;gap:10px">
      <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)">Jonathan Mathias</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.7">Brasil → Alemanha → Austrália. Mentor de carreira internacional para gestores e especialistas que levam a decisão a sério. Conteúdo toda semana no <a href="${APP_CONFIG.links.owned.linkedinJonathan}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:500">LinkedIn</a> e no <a href="${APP_IG_URL}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:500">Instagram</a>.</p>
    </div>
    <div class="sec-label-main">Avalie esta experiência</div>
    <div id="nps-block" style="background:#0d0d1a;border:1px solid var(--border);border-radius:var(--r);padding:22px 20px;margin:8px 0 16px">
      <div style="font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px">De 0 a 10, qual a probabilidade de você recomendar essa avaliação?</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5">0 = certamente não recomendaria · 10 = recomendaria com certeza<br><span style="font-size:11px;opacity:0.6">Usaremos este feedback principalmente de forma agregada para melhorar o diagnóstico.</span></div>
      <div id="nps-grid" style="display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin-bottom:12px"></div>
      <div id="nps-comment-wrap" style="display:none;margin-top:12px">
        <textarea id="nps-comment" placeholder="Comentário opcional: o que poderia ser melhor? O que mais gostou?" rows="3"
          style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r2);font-size:13px;color:var(--text);background:#111120;font-family:'Geist',sans-serif;outline:none;box-sizing:border-box;resize:vertical;line-height:1.5"></textarea>
      </div>
      <div id="nps-thanks" style="display:none;font-size:13px;color:#3ecf8e;text-align:center;padding:8px 0;font-weight:500">Obrigado pelo feedback!</div>
    </div>
    ${renderQaCard()}
    <div class="restart"><button class="restart-btn" id="btn-restart">Refazer a avaliação</button></div>`;

  document.getElementById('app').innerHTML='';
  document.getElementById('app').appendChild(wrap);

  function logCtaClick(ctaId, ctaLabel, ctaUrl, source){
    const payload={session_id:SESSION_ID,lead_id:LEAD._id,trilha:T,score:result.final,banda:band.lb,cta_id:ctaId,cta_label:ctaLabel,cta_url:ctaUrl,source,created_at:new Date().toISOString()};
    logEvent('cta_click',payload);
    supabaseInsert('ctaClicks',payload);
  }

  document.querySelectorAll('[data-primary-cta],.promo-btn,.mentoria-card-btn').forEach((el,idx)=>{
    el.addEventListener('click',()=>{
      const ctaId=el.dataset.primaryCta || (el.classList.contains('mentoria-card-btn')?'premium_link':'promo_link');
      logCtaClick(ctaId,el.textContent.trim(),el.href||'',`result_card_${idx}`);
    });
  });

  requestAnimationFrame(()=>{
    document.documentElement.style.setProperty('--ring-glow', T==='de'?'#D4AF37':'#173528');
    const ring=document.getElementById('score-ring');
    if(ring){ring.style.transition='stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)';ring.style.strokeDashoffset=off.toFixed(2);}
    let cur=0;const el=document.getElementById('score-n'),st=Math.max(1,Math.ceil(result.final/55));
    const bandEl=document.getElementById('score-band-txt');
    if(bandEl){bandEl.style.opacity='0';bandEl.style.transform='translateY(6px)';}
    const descEl=document.getElementById('score-desc-txt');
    if(descEl){descEl.style.opacity='0';}
    const t=setInterval(()=>{
      cur=Math.min(cur+st,result.final);
      if(el)el.textContent=cur;
      if(cur>=result.final){
        clearInterval(t);
        if(bandEl){setTimeout(()=>{bandEl.style.transition='opacity .4s ease,transform .4s cubic-bezier(.34,1.2,.64,1)';bandEl.style.opacity='1';bandEl.style.transform='translateY(0)';},100);}
        if(descEl){setTimeout(()=>{descEl.style.transition='opacity .5s ease';descEl.style.opacity='1';},400);}
      }
    },20);
    setTimeout(()=>{
      ['d1','d2','d3','d4'].forEach((d,i)=>{
        const bar=document.getElementById('bar-'+d);
        if(bar){setTimeout(()=>{bar.style.transition='width 1s cubic-bezier(.4,0,.2,1)';bar.style.width=result.dims[d]+'%';},i*120);}
      });
    },600);
  });

  const npsGrid=document.getElementById('nps-grid');
  if(npsGrid){
    const npsBlock=document.getElementById('nps-block');
    const npsConfirm=document.createElement('button');
    npsConfirm.id='nps-confirm';
    npsConfirm.textContent='Enviar avaliação';
    const corTrilha=T==='de'?'#D4AF37':'#173528';
    const corTxt2=T==='de'?'#0d0d00':'#fff';
    npsConfirm.style.cssText=`display:none;width:100%;padding:13px;border:none;border-radius:var(--r2);background:${corTrilha};color:${corTxt2};font-size:14px;font-weight:500;cursor:pointer;font-family:Geist,sans-serif;margin-top:12px;transition:opacity .15s`;
    npsConfirm.addEventListener('click',()=>{
      npsConfirm.style.display='none';
      npsGrid.querySelectorAll('button').forEach(b=>b.disabled=true);
      const thanks=document.getElementById('nps-thanks');
      if(thanks)thanks.style.display='block';
      const npsCommentEl=document.getElementById('nps-comment');
      const npsComment=(npsCommentEl?npsCommentEl.value:'').trim();
      const npsPayload={session_id:SESSION_ID,lead_id:LEAD._id,trilha:T,score:result.final,banda:band.lb,nps:NPS,comentario:npsComment||'',created_at:new Date().toISOString()};
      logEvent('nps',npsPayload);
      supabaseInsert('nps',npsPayload);
    });
    if(npsBlock){npsBlock.appendChild(npsConfirm);}
    for(let i=0;i<=10;i++){
      const btn=document.createElement('button');
      btn.textContent=i;
      btn.style.cssText='padding:13px 0;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:14px;font-family:DM Mono,monospace;font-weight:500;cursor:pointer;transition:all .2s';
      btn.addEventListener('click',()=>{
        NPS=i;
        npsGrid.querySelectorAll('button').forEach(b=>{
          const v=+b.textContent;
          const isSel=v===i;
          const col=v<=6?'#e85555':v<=8?'#f0c44a':'#3ecf8e';
          b.style.background=isSel?col:'var(--surface)';
          b.style.color=isSel?'#fff':'var(--text2)';
          b.style.borderColor=isSel?col:'var(--border)';
          b.style.transform=isSel?'scale(1.08)':'scale(1)';
        });
        npsConfirm.style.display='block';
          const cw=document.getElementById('nps-comment-wrap');
        if(cw)cw.style.display='block';
      });
      npsGrid.appendChild(btn);
    }
  }


  document.querySelectorAll('.ins-card').forEach(card=>{
    const chevron=card.querySelector('.ins-title-chevron');
    if(!chevron) return;
    card.style.cursor='pointer';
    card.addEventListener('click',()=>{card.classList.toggle('collapsed');});
  });

  bindDossierWorkspaceLaunch(result,band,motorResolution.decision,motorResolution.source);
  bindQaCard();

  document.getElementById('btn-restart').addEventListener('click',()=>{
    const savedLead={...LEAD};
    const savedGEO={...GEO};
    T='';QS=[];step=0;ANS={};CTR={adultos:0,criancas:0,jovens:0};NPS=null;
    clearDossierFlowState();
    LEAD=savedLead;GEO=savedGEO;
    renderTrilha();window.scrollTo(0,0);
  });
}

function switchRoute(){
  logEvent('route_switch_click',{from:T||null});
  T='';QS=[];step=0;ANS={};CTR={adultos:0,criancas:0,jovens:0};NPS=null;
  clearDossierFlowState();
  renderTrilha();window.scrollTo(0,0);
}

function routeSwitchInline(){
  if(!T) return '';
  return `<div class="route-switch-wrap"><button class="route-switch-btn" onclick="switchRoute()">Escolher outro destino</button></div>`;
}

syncAppVersionState();
if(window.location.hash==='#market') renderMarketChoice();
else if(window.location.hash==='#dossier-intake') renderDossierWorkspace('intake');
else if(window.location.hash==='#dossier-interview') renderDossierWorkspace('interview');
else renderTrilha();
logEvent('app_loaded');
</script>
</body>
</html>
