<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:8788 https://script.google.com https://script.googleusercontent.com https://zkzxpzjpoenmrvrmdqyb.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CIA App · Versão Beta · Elite Migration</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d14;
  --surface:#111120;
  --surface2:#1a1a27;
  --border:#252538;
  --border2:#3a3a58;
  --text:#f0f0fa;
  --text2:#b0b0cc;
  --muted:#7070a0;
  --accent:#D4AF37;
  --accent2:#b8920e;
  --au:#173528;
  --functional:#2B5EA7;
  --au2:#0E1714;
  --orange:#f07a4a;
  --red:#e85555;
  --gold:#f0c44a;
  --r:16px;--r2:10px;
  --grad-bg:linear-gradient(180deg,#0d0d14 0%,#0a0a12 100%);
  --grad-surface:linear-gradient(135deg,#141424 0%,#111120 100%);
}
body{font-family:'Geist',sans-serif;background:#070908;color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% -18%,rgba(201,164,106,.12),transparent 34%),linear-gradient(180deg,#070908 0%,#0B1114 44%,#050706 100%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px 180px}
.app{position:relative;z-index:1}
.app{max-width:560px;margin:0 auto;padding:20px 18px 80px}

/* TRILHA */
.trilha-wrap{min-height:calc(100vh - 100px);padding:10px 0 20px}
.cia-topbar{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:12px;padding:6px 2px 18px;border-bottom:1px solid rgba(201,164,106,.18)}
.cia-brand{text-align:center}
.cia-brand-name{font-family:'DM Serif Display',serif;font-size:28px;line-height:1;color:#F7F3EA}
.cia-brand-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#C9A46A;margin-top:7px}
.cia-topbar-spacer{width:24px;height:24px}
.cia-hero{position:relative;padding:42px 4px 26px;overflow:hidden;text-align:center;display:grid;justify-items:center}
.cia-map{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:368px;max-width:96%;opacity:.28;color:#C9A46A;pointer-events:none}
.cia-map-label{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1.3px;fill:currentColor;opacity:.55}
.cia-map-dot{fill:currentColor;opacity:.6}
.trilha-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;font-weight:600}
.trilha-h1{font-family:'DM Serif Display',serif;font-size:clamp(40px,9.4vw,56px);line-height:1.08;color:#F7F3EA;margin-bottom:24px;letter-spacing:0;max-width:460px;text-align:center;text-wrap:balance}
.cia-rule{width:54px;height:2px;background:#C9A46A;margin:0 auto 26px}
.trilha-sub{font-size:16px;color:rgba(247,243,234,.76);margin-bottom:0;line-height:1.68;max-width:430px;text-align:center}
.trilha-context{display:flex;flex-direction:column;gap:0;margin:18px auto 24px;border:1px solid rgba(201,164,106,.28);border-radius:8px;padding:0 18px;background:rgba(5,8,7,.58);max-width:470px}
.trilha-context-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#C9A46A;background:#070908;padding:0 8px;margin:-7px 0 0;width:max-content}
.trilha-proof{display:grid;grid-template-columns:62px 1fr 46px;align-items:center;gap:12px;padding:15px 0;background:transparent;border:none;border-bottom:1px solid rgba(201,164,106,.16);border-radius:0;backdrop-filter:none}
.trilha-proof:last-child{border-bottom:none}
.trilha-proof-icon{width:44px;height:44px;border-radius:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:0;color:#C9A46A;border:1px solid rgba(201,164,106,.38);background:transparent}
.trilha-proof-icon svg{width:25px;height:25px;stroke:currentColor}
.trilha-proof-text{font-size:13px;color:rgba(247,243,234,.72);line-height:1.5;text-align:left}
.trilha-proof-title{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.1;color:#F7F3EA;margin-bottom:5px}
.trilha-proof-text strong{color:var(--text);font-weight:500}
.trilha-proof-num{font-family:'DM Mono',monospace;font-size:14px;color:#C9A46A;text-align:right}
.cia-start-btn{width:100%;height:74px;border-radius:8px;border:1px solid #E4C284;background:linear-gradient(135deg,#DDB36D 0%,#C9A46A 52%,#B87942 100%);color:#080B09;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:18px;cursor:pointer;box-shadow:0 0 0 4px rgba(201,164,106,.1),0 18px 34px rgba(0,0,0,.38);transition:transform .18s ease,filter .18s ease}
.cia-start-btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
.cia-start-btn:focus-visible,.trilha-btn:focus-visible{outline:2px solid #F7F3EA;outline-offset:3px}
.cia-foot{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;gap:14px;border-top:1px solid rgba(201,164,106,.15);padding:16px 8px 0;margin-top:24px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(247,243,234,.38)}
.cia-foot-center{height:34px;border-left:1px solid rgba(201,164,106,.22);border-right:1px solid rgba(201,164,106,.22);display:flex;align-items:center;justify-content:center;color:#C9A46A}
.cia-foot-right{text-align:right;color:rgba(201,164,106,.62)}
.market-wrap{min-height:calc(100vh - 100px);padding:10px 0 20px}
.market-question{padding:42px 4px 24px;text-align:center;display:grid;justify-items:center}
.market-kicker{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#C9A46A;margin-bottom:16px}
.market-title{font-family:'DM Serif Display',serif;font-size:clamp(36px,9vw,52px);line-height:1.08;color:#F7F3EA;text-wrap:balance;margin-bottom:18px;max-width:430px}
.market-sub{font-size:15px;color:rgba(247,243,234,.64);line-height:1.7;max-width:390px;text-align:center}
.trilha-divider{display:flex;align-items:center;gap:12px;margin:0 auto 18px;max-width:440px}
.trilha-divider::before,.trilha-divider::after{content:'';flex:1;height:1px;background:rgba(201,164,106,.18)}
.trilha-divider-txt{font-family:'DM Mono',monospace;font-size:10px;color:rgba(247,243,234,.42);letter-spacing:2px;text-transform:uppercase;white-space:nowrap;padding:0 4px}
.trilha-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:440px;margin:0 auto 16px}
.trilha-btn-wrap{position:relative;border-radius:8px;padding:1px;animation:trilhaReveal .5s cubic-bezier(.34,1.2,.64,1) both}
.trilha-btn-wrap:nth-child(1){animation-delay:.1s}
.trilha-btn-wrap:nth-child(2){animation-delay:.2s}
.trilha-btn-wrap.de{background:linear-gradient(135deg,#C9A46A,#6a4e10,#17130a)}
.trilha-btn-wrap.au{background:linear-gradient(135deg,#285d45,#0E1714,#151b18)}
.trilha-btn-wrap:nth-child(1){animation-delay:.1s,.1s}
.trilha-btn-wrap:nth-child(2){animation-delay:.2s,.2s}
@keyframes gradientSpin{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes trilhaReveal{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.trilha-btn{width:100%;min-height:168px;padding:24px 14px 20px;border-radius:7px;border:none;background:linear-gradient(160deg,#11140f 0%,#090d0b 100%);cursor:pointer;font-family:'Geist',sans-serif;transition:all .3s cubic-bezier(.4,0,.2,1);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative}
.trilha-btn-wrap:hover{transform:translateY(-3px)}
.trilha-btn-wrap.de:hover .trilha-btn{background:linear-gradient(160deg,#181307 0%,#0d0d0a 100%)}
.trilha-btn-wrap.de:hover{box-shadow:0 12px 40px #D4AF3725}
.trilha-btn-wrap.au:hover .trilha-btn{background:linear-gradient(160deg,#07120d 0%,#0E1714 100%)}
.trilha-btn-wrap.au:hover{box-shadow:0 12px 40px #17352855}
.trilha-flag{width:62px;height:62px;display:flex;align-items:center;justify-content:center;flex-shrink:0;filter:drop-shadow(0 4px 16px rgba(0,0,0,.6));transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.trilha-btn-wrap:hover .trilha-flag{transform:scale(1.1)}
.trilha-nome{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;color:#F7F3EA;letter-spacing:0}
.trilha-btn-sub{font-size:10px;color:rgba(201,164,106,.68);margin-top:-4px;font-family:'DM Mono',monospace;letter-spacing:1.4px;text-transform:uppercase}
.market-back{margin:22px auto 0;border:1px solid rgba(201,164,106,.22);background:transparent;color:rgba(247,243,234,.62);border-radius:8px;padding:12px 18px;font-family:'Geist',sans-serif;font-size:13px;display:flex;cursor:pointer}

/* PROGRESSO */
.prog-wrap{margin-bottom:28px}
.prog-meta{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:10px}
.prog-bar{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;transition:width .4s ease}
.prog-fill.de{background:linear-gradient(90deg,#8b6a00,#D4AF37,#f5d060);background-size:200% 100%;animation:shimmer 2s ease infinite}
.prog-fill.au{background:linear-gradient(90deg,#0E1714,#173528,#2d634b);background-size:200% 100%;animation:shimmer 2s ease infinite}

/* BADGE JA NO DESTINO - FIX THAÍS */
.destino-badge{display:inline-flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:10px;font-weight:600}
.destino-badge.de{background:#D4AF3720;color:#D4AF37;border:1px solid #D4AF3440}
.destino-badge.au{background:#17352830;color:#78b896;border:1px solid #17352880}
.destino-badge-dot{width:5px;height:5px;border-radius:50%;animation:pulse 2s ease-in-out infinite}
.destino-badge.de .destino-badge-dot{background:#D4AF37}
.destino-badge.au .destino-badge-dot{background:#78b896}

/* CARD */
.q-card{background:var(--grad-surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 22px;margin-bottom:14px;box-shadow:0 2px 20px rgba(0,0,0,.18)}
.q-text{font-size:clamp(16px,4.5vw,18px);line-height:1.6;color:var(--text);margin-bottom:22px;font-weight:400;letter-spacing:-0.01em}
.q-hint{font-size:13px;color:var(--muted);margin-top:-14px;margin-bottom:20px;line-height:1.6;padding:10px 14px;background:#111120;border-radius:var(--r2);border-left:2px solid var(--border2)}

/* OPÇÕES */
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;background:#0d0d1a;border:1px solid var(--border);border-radius:var(--r2);cursor:pointer;transition:border-color .2s,background .2s,transform .15s cubic-bezier(.34,1.56,.64,1);text-align:left;width:100%;font-family:'Geist',sans-serif}
.opt-key{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:#1c1c30;border:1px solid #30304a;border-radius:5px;padding:3px 8px;flex-shrink:0;min-width:28px;text-align:center;transition:all .2s;letter-spacing:0.3px}
.opt-lbl{font-size:clamp(14px,4vw,15px);color:var(--text);line-height:1.4;transition:color .15s}
.opt:hover{border-color:var(--border2);background:#12121e;transform:translateX(3px)}
.opt:hover .opt-lbl{color:var(--text)}
.opt:active{transform:translateX(3px) scale(0.99)}
.opt.sel.de{border-color:#D4AF37;background:#1a1500}
.opt.sel.de .opt-key{background:#D4AF37;color:#0d0d00;border-color:#D4AF37}
.opt.sel.de .opt-lbl{color:var(--text);font-weight:500}
.opt.sel.au{border-color:#173528;background:#07120d}
.opt.sel.au .opt-key{background:#173528;color:#F7F3EA;border-color:#173528}
.opt.sel.au .opt-lbl{color:var(--text);font-weight:500}

/* FAMÍLIA - só contadores */
.fam-intro{font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.6;padding:12px 14px;background:#111120;border-radius:var(--r2);border:1px solid var(--border)}
.fam-grid{display:grid;gap:10px}
.fam-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#111120;border:1px solid #30304a;border-radius:var(--r2)}
.fam-lbl{font-size:14px;color:var(--text);font-weight:500}
.fam-sub{font-size:12px;color:var(--muted);margin-top:3px}
.fam-ctrl{display:flex;align-items:center;gap:14px}
.fam-btn{width:34px;height:34px;border-radius:50%;border:1px solid #30304a;background:#1c1c30;color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;flex-shrink:0}
.fam-btn:hover{border-color:var(--accent);color:var(--accent);background:#0d1a30}
.fam-val{font-family:'DM Mono',monospace;font-size:20px;min-width:24px;text-align:center;color:var(--accent);font-weight:500}
.fam-total{font-size:13px;color:var(--muted);text-align:center;margin-top:12px;font-family:'DM Mono',monospace}

/* NAV */
.nav{display:flex;gap:10px;margin-top:4px}
.btn-next{flex:1;padding:15px 20px;border-radius:var(--r2);font-size:15px;font-weight:500;cursor:pointer;border:none;font-family:'Geist',sans-serif;color:#fff;transition:opacity .15s,background .15s}
.btn-next.de{background:#D4AF37;color:#0d0d00}
.btn-next.au{background:#173528;color:#F7F3EA}
.btn-next:disabled{background:#252538;color:#4a4a68;cursor:not-allowed}
.btn-back{width:48px;flex-shrink:0;padding:14px;border-radius:var(--r2);font-size:18px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Geist',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center}
.btn-back:hover{border-color:var(--border2);color:var(--text)}

/* RESULTADOS */
.res{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.trilha-wrap{animation:fadeUp .5s ease both}
.q-card{animation:fadeUp .3s ease both}

.score-hero{text-align:center;padding:32px 0 24px}
.score-ring-wrap{position:relative;display:inline-block;margin-bottom:20px}
.score-ring-wrap::before{content:'';position:absolute;inset:-8px;border-radius:50%;opacity:0;animation:ringGlow 2.5s ease-in-out 1.2s forwards}
@keyframes ringGlow{0%{opacity:0;box-shadow:0 0 0px transparent}100%{opacity:1;box-shadow:0 0 40px var(--ring-glow,#D4AF37)44}}
.score-ring-wrap svg{display:block}
.score-num-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-big{font-family:'DM Serif Display',serif;font-size:64px;line-height:1;color:var(--text);letter-spacing:-2px}
.score-of{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:6px}
.score-band{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.score-band-pill{display:inline-block;padding:6px 18px;border-radius:20px;margin-bottom:14px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600;border:1px solid currentColor}
.score-desc{font-size:14px;color:var(--text2);max-width:300px;margin:0 auto;line-height:1.7}

/* DIMENSÕES */
.dims{display:grid;gap:10px;margin:16px 0 24px}
.dim-bar-wrap{background:#0d0d1a;border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.dim-bar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.dim-bar-name{font-size:13px;color:var(--text2);font-weight:500}
.dim-bar-pct{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.dim-bar-score{font-family:'DM Mono',monospace;font-size:13px;color:var(--text);font-weight:500}
.dim-bar-track{height:5px;background:#1e1e30;border-radius:3px;overflow:hidden}
.dim-bar-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}

/* BANDAS */
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 24px}
.band{padding:10px 6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);text-align:center;transition:all .2s}
.band.act{border-width:2px;transform:translateY(-2px);background:linear-gradient(135deg,#1c1c2e 0%,#141420 100%)}
.band-name{font-size:11px;font-weight:500;margin-bottom:3px;line-height:1.2}
.band-range{font-family:'DM Mono',monospace;font-size:9px;opacity:0.5}

/* ALERTAS */
.alert-wrap{display:grid;gap:9px;margin-bottom:20px}
.alert-card{padding:14px 16px;border-radius:var(--r2);border:1px solid;display:flex;gap:12px;align-items:flex-start}
.alert-card.warn{border-color:#f0c44a50;background:#f0c44a0d}
.alert-card.danger{border-color:#e8555550;background:#e855550d}
.alert-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.alert-card.warn .alert-dot{background:var(--gold)}
.alert-card.danger .alert-dot{background:var(--red)}
.alert-text{font-size:13px;color:var(--text2);line-height:1.6}
.alert-text strong{color:var(--text);font-weight:500}

/* SEÇÃO */
.sec-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;margin-top:28px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-label-main{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;margin-top:28px;display:flex;align-items:center;gap:10px;font-weight:500}
.sec-label-main::after{content:'';flex:1;height:1px;background:var(--border)}
.collapse-toggle{background:transparent;border:1px solid var(--border);border-radius:var(--r2);color:var(--muted);font-size:12px;padding:7px 14px;cursor:pointer;font-family:'Geist',sans-serif;margin-bottom:8px;width:100%;text-align:center;transition:all .15s}
.collapse-toggle:hover{border-color:var(--border2);color:var(--text)}

/* INSIGHTS */
.ins-card{background:var(--grad-surface);border:1px solid var(--border);border-left-width:3px;border-radius:0 var(--r2) var(--r2) 0;padding:16px 18px;margin-bottom:8px;animation:insReveal .4s ease both}
@keyframes insReveal{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.ins-card:nth-child(1){animation-delay:.1s}
.ins-card:nth-child(2){animation-delay:.18s}
.ins-card:nth-child(3){animation-delay:.26s}
.ins-card:nth-child(4){animation-delay:.34s}
.ins-card:nth-child(5){animation-delay:.42s}
.ins-card:nth-child(6){animation-delay:.5s}
.ins-card:nth-child(7){animation-delay:.58s}
.ins-card:nth-child(8){animation-delay:.66s}
.ins-card.collapsed .ins-text{display:none}
.ins-card.collapsed{cursor:pointer}
.ins-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;letter-spacing:-0.01em;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ins-title-chevron{font-size:9px;color:var(--border2);flex-shrink:0;margin-top:3px;transition:transform .2s,color .15s;opacity:0.6}
.ins-card:hover .ins-title-chevron{color:var(--muted);opacity:1}

const SHEETS_URL = APP_CONFIG.integrations.gasUrl;
window.__CIA_LAST_SUPABASE_RESULT__ = null;

function esc(v){
  return String(v ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function safeJsonParse(raw){
  try{return JSON.parse(raw);}catch(e){return null;}
}

function getRuntimeQueryParams(){
  return RUNTIME_PARAMS;
}

function debugLog(){
  if(!QA_MODE) return;
  try{console.log.apply(console, arguments);}catch(e){}
}

function getDossierMotorConfig(){
  const base=APP_CONFIG.integrations.dossierMotor||{};
  const runtime=(typeof window!=='undefined'&&window.__CIA_DOSSIER_CONFIG__)||{};
  const params=getRuntimeQueryParams();
  const urlParam=params.get('dossierMotorUrl')||'';
  const enableLocal=params.get('dossierMotor')==='local';
  return {
    enabled: runtime.enabled ?? (enableLocal||!!urlParam||base.enabled||false),
    decisionUrl: runtime.decisionUrl || urlParam || (enableLocal?'http://127.0.0.1:8788/decide':'') || base.decisionUrl || '',
    timeoutMs: runtime.timeoutMs || base.timeoutMs || 4000,
    storageKey: runtime.storageKey || base.storageKey || 'ciaDossierDecision',
    inputStorageKey: runtime.inputStorageKey || base.inputStorageKey || 'ciaDossierInput'
  };
}

function getDossierProductLinks(){
  const runtime=(typeof window!=='undefined'&&window.__CIA_DOSSIER_LINKS__)||{};
  const params=getRuntimeQueryParams();
  return {
    lite: runtime.dossieLite || params.get('dossieLiteUrl') || APP_CONFIG.links.products.dossieLite || '',
    completo: runtime.dossieCompleto || params.get('dossieCompletoUrl') || APP_CONFIG.links.products.dossieCompleto || ''
  };
}

function getStoredMotorDecision(){
  const key=getDossierMotorConfig().storageKey;
  const globalDecision=(typeof window!=='undefined'&&window.__CIA_DOSSIER_DECISION__)||null;
  if(globalDecision&&typeof globalDecision==='object') return globalDecision;
  try{
    const raw=sessionStorage.getItem(key);
    return raw?safeJsonParse(raw):null;
  }catch(e){
    return null;
  }
}

function storeMotorDecision(decision){
  const key=getDossierMotorConfig().storageKey;
  try{sessionStorage.setItem(key,JSON.stringify(decision));}catch(e){}
  try{localStorage.removeItem(key);}catch(e){}
}

function clearMotorDecision(){
  const key=getDossierMotorConfig().storageKey;
  try{sessionStorage.removeItem(key);}catch(e){}
  try{localStorage.removeItem(key);}catch(e){}
}

function storeMotorInput(input){
  const key=getDossierMotorConfig().inputStorageKey;

}

  try{localStorage.removeItem(key);}catch(e){}
}

function getStoredMotorInput(){
  const key=getDossierMotorConfig().inputStorageKey;
  const globalInput=(typeof window!=='undefined'&&window.__CIA_DOSSIER_INPUT__)||null;
  if(globalInput&&typeof globalInput==='object') return globalInput;
  try{
    const raw=sessionStorage.getItem(key);

function getDossierFulfillmentStorageKey(){

}

function getStoredDossierFulfillment(){

    const raw=sessionStorage.getItem(key);

function storeDossierFulfillment(state){

function clearDossierFulfillment(){

  try{localStorage.removeItem(key);}catch(e){}
}

function isDossierFulfillmentUnlocked(){
  const state=getStoredDossierFulfillment();
  return !!(state&&state.unlockedAt);
}

function clearDossierFlowState(){
  clearDossierFulfillment();
  clearDossierInterview();
  clearMotorInput();
  clearMotorDecision();
}

function getDossierWorkspaceStorageKey(){
  return 'ciaDossierWorkspaceContext';
}

function getStoredDossierWorkspaceContext(){

    const raw=localStorage.getItem(key);

  }
}

function storeDossierWorkspaceContext(context){
  const key=getDossierWorkspaceStorageKey();
  try{localStorage.setItem(key,JSON.stringify(context));}catch(e){}
}

function clearDossierWorkspaceContext(){
  const key=getDossierWorkspaceStorageKey();
  try{localStorage.removeItem(key);}catch(e){}
}

function isDossierWorkspaceHash(hashValue){
  const hash=typeof hashValue==='string'?hashValue:window.location.hash;
  return hash==='#dossier-intake'||hash==='#dossier-interview';
}

function buildCurrentAppUrlWithHash(hash){
  try{
    const url=new URL(window.location.href);
    url.hash=hash;
    return url.toString();
  }catch(e){
    return `${window.location.pathname}${window.location.search}${hash}`;
  }
}

function replaceHashSilently(hash){
  const next=buildCurrentAppUrlWithHash(hash);
  try{window.history.replaceState({},'',next);}catch(e){window.location.hash=hash;}
}

function buildDossierWorkspaceContext(result,band,rawDecision,motorSource){
  return {
    savedAt:new Date().toISOString(),
    trilha:T||'',
    answers:ANS||{},
    counters:CTR||{adultos:0,criancas:0,jovens:0},
    geo:GEO||{},
    result:result||null,
    band:band||null,
    rawDecision:rawDecision||null,
    motorSource:motorSource||null
  };
}

function restoreDossierWorkspaceGlobals(context){
  if(!context||typeof context!=='object') return;
  if(context.trilha) T=context.trilha;
  if(context.answers&&typeof context.answers==='object') ANS=context.answers;
  if(context.counters&&typeof context.counters==='object') CTR=context.counters;
  if(context.geo&&typeof context.geo==='object') GEO={...GEO,...context.geo};
}

function openDossierWorkspace(mode,result,band,rawDecision,motorSource){
  const hash=mode==='interview'?'#dossier-interview':'#dossier-intake';
  storeDossierWorkspaceContext(buildDossierWorkspaceContext(result,band,rawDecision,motorSource));
  const url=buildCurrentAppUrlWithHash(hash);
  let opened=null;
  try{opened=window.open(url,'_blank','noopener');}catch(e){}
  if(!opened){
    window.location.href=url;
  }
}

function clearLegacyDossierStorage(){
  const keys=[
    'ciaDossierDecision',
    'ciaDossierInput',
    'ciaDossierInput_adaptiveInterview',
    'ciaDossierInput_fulfillment',
    'ciaDossierMotorDecision',
    'ciaDossierMotorInput',
    'ciaDossierInterview',
    'ciaDossierFulfillment'
  ];
  keys.forEach((key)=>{
    try{sessionStorage.removeItem(key);}catch(e){}
    try{localStorage.removeItem(key);}catch(e){}
  });
}

function syncAppVersionState(){
  const key='ciaAppVersion';
  try{
    const current=APP_CONFIG.version;
    const previous=localStorage.getItem(key);
    if(previous!==current){
      clearLegacyDossierStorage();
      clearDossierFlowState();
      localStorage.setItem(key,current);
    }
  }catch(e){}
}

function getMotorDecisionSummary(decision){
  if(!decision||typeof decision!=='object') return null;
  const d=decision.decision||{};
  const status=d.status||null;
  const offer=d.recommended_offer||null;
  const nextStep=d.next_step||null;
  if(!['Lite','Completo','Recusa','Faltam dados'].includes(status)) return null;
  return {status,recommendedOffer:offer,nextStep};
}

function renderMotorDecisionAudit(rawDecision){
  if(!rawDecision||typeof rawDecision!=='object') return '';
  const audit=rawDecision.audit&&typeof rawDecision.audit==='object'?rawDecision.audit:{};
  const axes=audit.tier_axes&&typeof audit.tier_axes==='object'?audit.tier_axes:null;
  if(!axes) return '';
  const reasons={
    density:Array.isArray(axes.densityReasons)?axes.densityReasons.filter(Boolean):[],
    proof:Array.isArray(axes.proofReasons)?axes.proofReasons.filter(Boolean):[],
    complexity:Array.isArray(axes.complexityReasons)?axes.complexityReasons.filter(Boolean):[]
  };
  const items=[
    {label:'Densidade',value:axes.density,reasons:reasons.density},
    {label:'Prova',value:axes.proof,reasons:reasons.proof},
    {label:'Complexidade',value:axes.complexity,reasons:reasons.complexity}
  ];
  return `<div style="margin-top:14px;padding:14px 14px 12px;border:1px solid var(--border);border-radius:var(--r2);background:#0d0d1a">
    <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px">Leitura do motor</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
      ${items.map(item=>`<div style="padding:10px 10px 8px;border:1px solid var(--border);border-radius:10px;background:#111120">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${item.label}</div>
        <div style="font-family:'DM Serif Display',serif;font-size:26px;color:var(--text);line-height:1">${item.value}</div>
        <div style="font-size:11px;color:var(--text2);line-height:1.5;margin-top:6px">${esc(item.reasons[0]||'Sem leitura detalhada')}</div>
      </div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text2);line-height:1.65"><strong style="color:var(--text)">Soma:</strong> ${axes.total}/6. Regra atual do app: <strong style="color:var(--text)">4-6 = Completo</strong>, <strong style="color:var(--text)">0-3 = Lite</strong>.</div>
  </div>`;
}

function dossierHasText(value,min=1){
  return typeof value==='string'&&value.trim().length>=min;
}

function normalizeComparableText(value){
  return String(value||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}

function truncateText(value,max=280){
  const text=String(value||'').trim().replace(/\s+/g,' ');
  if(text.length<=max) return text;
  return `${text.slice(0,Math.max(0,max-1)).trim()}...`;
}

function splitTextChunks(value){
  return String(value||'')
    .split(/\n+/)
    .map(item=>item.trim())
    .filter(Boolean);
}

function inferCareerDomain(value){
  const normalized=normalizeComparableText(value);
  if(!normalized) return null;
  const domains=[
    {id:'engineering',label:'Engenharia',keywords:['engineer','engineering','mechanical','motorsport','cfd','aerodynamic','simulation','cad','manufacturing engineer']},
    {id:'operations',label:'Operacoes',keywords:['operations','operational','supply chain','logistics','process','plant','production','service manager','customer service','after sales','spare parts']},
    {id:'software',label:'Tecnologia e Produto Digital',keywords:['software','developer','data scientist','product manager','frontend','backend','machine learning','programador','engenheiro de software']},
    {id:'sales',label:'Comercial e Negocios',keywords:['sales','business development','account manager','growth','revenue','commercial']},
    {id:'finance',label:'Financas',keywords:['finance','financial','fp&a','controller','accounting','controllership']},
    {id:'marketing',label:'Marketing',keywords:['marketing','content','brand','seo','media']}
  ];
  const scored=domains.map(domain=>({
    domain,
    score:domain.keywords.reduce((acc,keyword)=>acc+(normalized.includes(keyword)?1:0),0)
  })).sort((a,b)=>b.score-a.score);
  return scored[0]&&scored[0].score>0?scored[0].domain:null;
}

function extractCvHeadline(cvText){
  const chunks=splitTextChunks(cvText);
  return chunks.find(line=>line.length>=24&&line.length<=220)||'';
}

function extractCvRoleSnippets(cvText,max=3){
  const chunks=splitTextChunks(cvText);
  const lines=chunks.filter(line=>/(19|20)\d{2}|present|atual|freelance/i.test(line)&&/[A-Za-z]/.test(line));
  return lines.slice(0,max);
}

function extractCvMetricSnippets(cvText,max=3){
  const chunks=splitTextChunks(cvText);
  const lines=chunks.filter(line=>/%|\b\d+\s?(k|m|mil|runs|meses|months|years|anos|cars?)\b/i.test(line));
  return lines.slice(0,max);
}

function summarizeCvSnapshot(cvText){
  const headline=extractCvHeadline(cvText);
  const roles=extractCvRoleSnippets(cvText,3);
  if(!headline&&roles.length===0) return truncateText(cvText,260)||'Base de CV ainda nao resumida.';
  return [headline].concat(roles).filter(Boolean).map(item=>truncateText(item,180)).join(' | ');
}

function getInterviewResolvedValue(question,state,motorInput){
  if(!question) return '';
  const answers=state&&state.answers&&typeof state.answers==='object'?state.answers:{};
  const direct=answers[question.id];
  if(isInterviewAnswerValid(question,direct)) return direct;
  const questionnaire=motorInput&&motorInput.questionnaire&&typeof motorInput.questionnaire==='object'?motorInput.questionnaire:{};
  const materials=motorInput&&motorInput.materials&&typeof motorInput.materials==='object'?motorInput.materials:{};
  if(question.id==='target_positioning'){
    const roles=Array.isArray(questionnaire.target_role_hypotheses)?questionnaire.target_role_hypotheses.filter(Boolean):[];
    const goal=String(questionnaire.goal_for_next_12_months||'').trim();
    const synthesized=[roles.join(' / '),goal].filter(Boolean).join(' | ');
    if(dossierHasText(synthesized,question.minLength||1)) return synthesized;
  }
  if(question.id==='measurable_results'&&dossierHasText(questionnaire.evidence_of_results,question.minLength||1)) return questionnaire.evidence_of_results;
  if(question.id==='market_proof'){
    const parts=[];
    if(materials.linkedin) parts.push('LinkedIn utilizavel');
    if(materials.portfolio) parts.push('Portfolio disponivel');
    if(materials.github) parts.push('GitHub relevante');
    const synthesized=parts.join(', ');
    if(dossierHasText(synthesized,question.minLength||1)) return synthesized;
  }
  return '';
}

function isWeakStrategicAnswer(value){
  if(!dossierHasText(value,12)) return true;
  const normalized=value.trim().toLowerCase();
  return [
    'muito cedo',
    'ainda estou vendo',
    'ainda estou avaliando',
    'ainda nao sei',
    'ainda não sei',
    'qualquer mercado serve',
    'qualquer vaga serve'
  ].includes(normalized);
}

function isLowAvailability(value){
  if(!dossierHasText(value)) return false;
  return ['baixa','muito baixa','low','very_low'].includes(value.trim().toLowerCase());
}

function isUnrealisticTimeline(value){
  if(!dossierHasText(value)) return false;
  return ['0-3 meses','0-3 months','urgent_without_base'].includes(value.trim().toLowerCase());
}

function splitEvidencePoints(value){
  return String(value||'')
    .split(/[\n;]+|(?<=\.)\s+/)
    .map(item=>item.trim())
    .filter(Boolean);
}

function countDefendableEvidence(value){
  return splitEvidencePoints(value).filter(item=>item.length>=18).length;
}

function hasConcreteProofSignal(value){
  if(!dossierHasText(value,8)) return false;
  const normalized=String(value||'').trim().toLowerCase();
  return /(\d|%|r\$|usd|eur|\$|k\b|m\b|mil|milh)/.test(normalized) ||
    /(reduz|reduc|aument|grow|grew|improv|saved|econom|revenue|custo|tempo|prazo|throughput|conversion)/.test(normalized);
}

function hasPremiumMarketAsset(materials){
  const source=materials&&typeof materials==='object'?materials:{};
  return !!(source.linkedin||source.portfolio||source.github);
}

function hasSpecificRoleHypothesis(value){
  return Array.isArray(value)&&value.some(item=>dossierHasText(item,4));
}

function normalizeDecisionText(value){
  return String(value||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase();
}

function hasReferenceOpportunity(value){
  if(!dossierHasText(value,6)) return false;
  const normalized=normalizeDecisionText(value);
  return !/(nenhuma|nenhum|nao tenho|nao mapeei|ainda nao|ainda nao tenho|sem vaga)/.test(normalized);
}

function countAlternativeMarkets(value){
  const normalized=normalizeDecisionText(value);
  if(!normalized) return 0;
  const markets=['alemanha','australia','canada','estados unidos','eua','reino unido','uk','irlanda','holanda','portugal'];
  return markets.filter(market=>normalized.includes(market)).length;
}

function detectReferenceMarketTension(referenceValue,route){
  const normalized=normalizeDecisionText(referenceValue);
  if(!normalized) return false;
  const isGermanyRoute=normalizeDecisionText(route).includes('alemanha');
  const routeTerms=isGermanyRoute?['alemanha','germany','berlin','munich','munique']:['australia','sydney','melbourne','brisbane','perth'];
  const foreignTerms=isGermanyRoute
    ? ['australia','sydney','melbourne','brisbane','perth','uk','reino unido','canada','estados unidos','eua']
    : ['alemanha','germany','berlin','munich','munique','uk','reino unido','canada','estados unidos','eua'];
  const mentionsRoute=routeTerms.some(term=>normalized.includes(term));
  const mentionsForeign=foreignTerms.some(term=>normalized.includes(term));
  return mentionsForeign&&!mentionsRoute;
}

function scoreTierAxes(input){
  const route=input&&input.route?input.route:(T==='de'?'Alemanha':'Austrália');
  const questionnaire=input&&input.questionnaire&&typeof input.questionnaire==='object'?input.questionnaire:{};
  const profile=input&&input.profile&&typeof input.profile==='object'?input.profile:{};
  const materials=input&&input.materials&&typeof input.materials==='object'?input.materials:{};
  const seniority=profile.seniority_level||'';
  const roles=Array.isArray(questionnaire.target_role_hypotheses)?questionnaire.target_role_hypotheses.filter(Boolean):[];
  const evidence=questionnaire.evidence_of_results||'';
  const marketLogic=questionnaire.target_market_logic||'';
  const reference=questionnaire.reference_opportunity||'';
  const hasConcreteProof=hasConcreteProofSignal(evidence);
  const hasMarketAsset=hasPremiumMarketAsset(materials);
  const referenceMapped=hasReferenceOpportunity(reference);
  const alternativeMarkets=countAlternativeMarkets(marketLogic);
  const referenceTension=detectReferenceMarketTension(reference,route);
  const tradeoff=questionnaire.has_meaningful_tradeoffs===true;
  const highAmbiguity=questionnaire.high_ambiguity_case===true;
  const storyInconsistent=questionnaire.story_inconsistent===true;

  let density=0;
  const densityReasons=[];
  if(['Senior','Especialista'].includes(seniority)){
    density=1;
    densityReasons.push('senioridade consolidada');
  }
  if(['Lideranca','Executivo'].includes(seniority)||((['Senior','Especialista'].includes(seniority))&&hasConcreteProof)){
    density=2;
    densityReasons.push('trajetória sênior com responsabilidade defensável');
  }
  if(!densityReasons.length&&roles.length) densityReasons.push('senioridade ainda sem prova suficiente para leitura premium');

  let proof=0;
  const proofReasons=[];
  if(hasConcreteProof||referenceMapped||hasMarketAsset){
    proof=1;
    proofReasons.push('já existe alguma prova ou ativo de mercado');
  }
  if(hasConcreteProof&&referenceMapped){
    proof=2;
    proofReasons.push('resultado concreto combinado com vaga de referência mapeada');
  }
  if(proof===2&&hasMarketAsset) proofReasons.push('ativo adicional de mercado reforça a prova');
  if(!proofReasons.length) proofReasons.push('prova ainda depende mais de intenção do que de evidência');

  let complexity=0;
  const complexityReasons=[];
  if(roles.length>1||tradeoff||alternativeMarkets>1){
    complexity=1;
    complexityReasons.push('já existe mais de uma variável real competindo');
  }
  if(highAmbiguity||storyInconsistent||referenceTension||(tradeoff&&(roles.length>1||alternativeMarkets>1))){
    complexity=2;
    complexityReasons.push(referenceTension
      ? 'vaga de referência aponta para uma trilha diferente da rota declarada'
      : 'caso tem ambiguidade ou contradição real');
  }
  if(!complexityReasons.length) complexityReasons.push('caminho ainda parece relativamente linear');

  return {
    density,
    proof,
    complexity,
    total:density+proof+complexity,
    referenceMapped,
    referenceTension,
    hasConcreteProof,
    hasMarketAsset,
    densityReasons,
    proofReasons,
    complexityReasons
  };
}

function decideDossierInBrowser(input){
  const score=Number.isFinite(input&&input.score)?input.score:0;
  const materials=input&&input.materials&&typeof input.materials==='object'?input.materials:{};
  const questionnaire=input&&input.questionnaire&&typeof input.questionnaire==='object'?input.questionnaire:null;
  const profile=input&&input.profile&&typeof input.profile==='object'?input.profile:{};
  const decisionId=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():`decision_${Date.now()}`;
  const payload={
    decision_meta:{
      decision_id:decisionId,
      generated_at:new Date().toISOString(),
      engine_version:'browser-fallback-v1',
      schema_version:'v1'
    },
    input_snapshot:{
      lead_id:input&&input.lead_id?input.lead_id:null,
      source_route:input&&input.route?input.route:(T==='de'?'Alemanha':'Austrália'),
      cia_band_public:input&&input.band?input.band:null,
      cia_score:score,
      has_cv:!!materials.cv,
      has_strategic_questionnaire:!!questionnaire,
      has_linkedin:!!materials.linkedin,
      has_portfolio:!!materials.portfolio,
      has_github:!!materials.github
    },
    decision:{
      status:null,
      recommended_offer:null,
      payment_eligibility:'blocked',
      requires_human_review:false,
      decision_summary:'',
      next_step:'manual_review'
    },
    lists:{required:[],warning:[],blocking:[]},
    commercial:{
      can_show_payment:false,
      can_choose_offer_freely:false,
      commercial_message_key:'manual_review'
    },
    generation:{
      output_template:null,
      intake_schema:null,
      questionnaire_action:'none'
    },
    audit:{
      decision_reasons:[],
      critical_facts:[],
      policy_flags:[
        'no_job_promise',
        'no_visa_promise',
        'payment_after_decision_only',
        'single_complement_round_only',
        'language_is_real_guardrail'
      ]
    }
  };

  const setDecision=(status,config)=>{
    payload.decision.status=status;
    payload.decision.recommended_offer=config.recommendedOffer||null;
    payload.decision.payment_eligibility=config.paymentEligibility||'blocked';
    payload.decision.requires_human_review=!!config.requiresHumanReview;
    payload.decision.next_step=config.nextStep;
    payload.decision.decision_summary=`${status}: ${payload.audit.decision_reasons[0]||'decisão gerada'}`;
    payload.commercial.can_show_payment=!!config.canShowPayment;
    payload.commercial.commercial_message_key=config.messageKey||'manual_review';
    payload.generation.questionnaire_action=config.questionnaireAction||'none';
    payload.generation.output_template=config.outputTemplate||null;
    payload.generation.intake_schema=config.intakeSchema||null;
    return payload;
  };

  if(!materials.cv){
    payload.lists.required.push({code:'missing_cv',message:'CV ausente.',source:'cv'});
    payload.audit.decision_reasons.push('faltou CV atual');
    payload.audit.critical_facts.push('materials.cv=false');
  }

  payload.audit.critical_facts.push(`cia_score=${score}`);

  if(!questionnaire){
    payload.lists.required.push({code:'missing_questionnaire',message:'Questionário estratégico complementar ausente.',source:'strategic_questionnaire'});
    payload.audit.decision_reasons.push('faltou questionário complementar');
  }

  if(payload.lists.blocking.length>0){
    return setDecision('Recusa',{
      paymentEligibility:'blocked',
      nextStep:'route_to_basic',
      canShowPayment:false,
      messageKey:'route_to_basic'
    });
  }

  if(payload.lists.required.some(item=>item.code==='missing_questionnaire')){
    return setDecision('Faltam dados',{
      paymentEligibility:'pending_complement',
      nextStep:'request_complement',
      canShowPayment:false,
      messageKey:'request_complement',
      questionnaireAction:'request_complement_once'
    });
  }

  if(isWeakStrategicAnswer(questionnaire.goal_for_next_12_months)){
    payload.lists.required.push({code:'goal_unclear',message:'Objetivo dos próximos 12 meses ainda está vago.',source:'strategic_questionnaire'});
  }
  if(isWeakStrategicAnswer(questionnaire.target_market_logic)){
    payload.lists.required.push({code:'market_logic_weak',message:'Lógica do mercado-alvo ainda está fraca.',source:'strategic_questionnaire'});
  }
  if(!dossierHasText(questionnaire.language_level_detail,6)){
    payload.lists.required.push({code:'language_level_missing',message:'Nível de idioma não foi confirmado.',source:'strategic_questionnaire'});
  }
  if(!dossierHasText(questionnaire.reference_opportunity,6)){
    payload.lists.required.push({code:'reference_opportunity_missing',message:'Falta vaga de referência ou declaração explícita de que ainda não existe.',source:'strategic_questionnaire'});
  }
  if(!dossierHasText(questionnaire.evidence_of_results,12)){
    payload.lists.warning.push({code:'insufficient_evidence',message:'Evidência de resultados ainda está fraca.',source:'strategic_questionnaire'});
  }
  if(!hasSpecificRoleHypothesis(questionnaire.target_role_hypotheses)){
    payload.lists.required.push({code:'target_roles_unclear',message:'Hipótese de cargo-alvo ainda está vaga.',source:'strategic_questionnaire'});
  }
  if(isLowAvailability(questionnaire.availability_for_execution)){
    payload.lists.warning.push({code:'availability_low',message:'Disponibilidade baixa para executar o plano.',source:'strategic_questionnaire'});
  }
  if(isUnrealisticTimeline(questionnaire.urgency_window)){
    payload.lists.warning.push({code:'timeline_unrealistic',message:'Prazo agressivo demais para a base atual.',source:'strategic_questionnaire'});
  }
  if(questionnaire.language_structural_block===true){
    payload.lists.blocking.push({code:'language_gap_structural',message:'Idioma ainda é gargalo estrutural real.',source:'combined'});
    payload.audit.decision_reasons.push('idioma como gargalo estrutural');
  }
  if(questionnaire.story_inconsistent===true){
    payload.lists.warning.push({code:'story_inconsistent',message:'História profissional apresenta inconsistências relevantes.',source:'combined'});
  }

  if(payload.lists.blocking.length>0){
    return setDecision('Recusa',{
      paymentEligibility:'blocked',
      nextStep:'route_to_basic',
      canShowPayment:false,
      messageKey:'route_to_basic'
    });
  }

  if(payload.lists.required.length>0){
    payload.audit.decision_reasons.push('faltam dados críticos para decidir');
    return setDecision('Faltam dados',{
      paymentEligibility:'pending_complement',
      nextStep:'request_complement',
      canShowPayment:false,
      messageKey:'request_complement',
      questionnaireAction:'request_complement_once'
    });
  }

  const axes=scoreTierAxes({
    route:input&&input.route?input.route:(T==='de'?'Alemanha':'Austrália'),
    questionnaire,
    profile,
    materials
  });

  payload.audit.tier_axes=axes;
  payload.audit.critical_facts.push(`axis_density=${axes.density}`);
  payload.audit.critical_facts.push(`axis_proof=${axes.proof}`);
  payload.audit.critical_facts.push(`axis_complexity=${axes.complexity}`);
  payload.audit.critical_facts.push(`axis_total=${axes.total}`);
  payload.audit.critical_facts.push(`reference_mapped=${axes.referenceMapped}`);
  payload.audit.critical_facts.push(`reference_tension=${axes.referenceTension}`);
  payload.audit.critical_facts.push(`has_concrete_proof=${axes.hasConcreteProof}`);

  if(!axes.hasConcreteProof){
    payload.lists.warning.push({code:'evidence_without_proof_signal',message:'A evidência ainda carece de número, impacto ou contexto concreto.',source:'strategic_questionnaire'});
  }
  if(!axes.referenceMapped){
    payload.lists.warning.push({code:'reference_not_mapped',message:'Ainda não existe vaga de referência clara mapeada pelo lead.',source:'strategic_questionnaire'});
  }
  if(!axes.hasMarketAsset){
    payload.lists.warning.push({code:'market_assets_light',message:'Falta ao menos um ativo adicional de mercado para sustentar um premium.',source:'materials'});
  }

  const warningCount=payload.lists.warning.length;
  const requiresHumanReview=axes.total>=5||[questionnaire.high_ambiguity_case,questionnaire.story_inconsistent,warningCount>=3].filter(Boolean).length>=2;
  if(requiresHumanReview){
    payload.lists.warning.push({code:'needs_manual_review',message:'Caso pede validação humana antes de maior automação.',source:'combined'});
  }

  const completoEligible=axes.total>=4;

  if(completoEligible){
    payload.lists.warning.push({code:'tier_completo_by_axes',message:`Soma D/P/C = ${axes.total}/6.`,source:'combined'});
    payload.lists.warning.push({code:'good_fit_completo',message:'Bom fit para Dossiê Completo.',source:'combined'});
    payload.audit.decision_reasons.push(`soma D/P/C em ${axes.total}/6 com leitura premium defensável`);
    return setDecision('Completo',{
      recommendedOffer:'Completo',
      paymentEligibility:'allowed',
      requiresHumanReview,
      nextStep:'offer_completo',
      canShowPayment:true,
      messageKey:'offer_completo',
      outputTemplate:'template-output-dossie-completo.md',
      intakeSchema:'schema-intake-dossie-completo.json'
    });
  }

  payload.lists.warning.push({code:'tier_lite_by_axes',message:`Soma D/P/C = ${axes.total}/6.`,source:'combined'});
  payload.lists.warning.push({code:'good_fit_lite',message:'Bom fit para Dossiê Lite.',source:'combined'});
  payload.audit.decision_reasons.push(`soma D/P/C em ${axes.total}/6, ainda sem densidade suficiente para completo`);
  return setDecision('Lite',{
    recommendedOffer:'Lite',
    paymentEligibility:'allowed',
    requiresHumanReview,
    nextStep:'offer_lite',
    canShowPayment:true,
    messageKey:'offer_lite',
    outputTemplate:'template-output-dossie-lite.md',
    intakeSchema:'schema-intake-dossie-lite.json'
  });
}

function buildMotorRequest(result,band){
  const extra=getStoredMotorInput();
  if(!extra||typeof extra!=='object') return null;
  const profile=extra.profile&&typeof extra.profile==='object' ? extra.profile : {};
  const materials=extra.materials&&typeof extra.materials==='object' ? extra.materials : {};
  const questionnaire=extra.questionnaire&&typeof extra.questionnaire==='object' ? extra.questionnaire : null;
  return {
    lead_id: LEAD&&LEAD._id?LEAD._id:null,
    route: T==='de'?'Alemanha':'Austrália',
    band: band.lb,
    score: result.final,
    profile: {
      seniority_level: profile.seniority_level || null,
      area: ANS['p3'] ? ANS['p3'].v : null
    },
    materials: {
      cv: !!materials.cv,
      linkedin: typeof materials.linkedin==='boolean' ? materials.linkedin : ((ANS['p11']?ANS['p11'].v:0) >= 2),
      portfolio: !!materials.portfolio,
      github: !!materials.github
    },
    questionnaire: questionnaire ? {
      ...questionnaire,
      target_role_hypotheses: Array.isArray(questionnaire.target_role_hypotheses)
        ? questionnaire.target_role_hypotheses.filter(Boolean)
        : []
    } : null
  };
}

function buildDossierIntakeRecord(result,band,input){
  if(!input||typeof input!=='object') return null;

function buildDossierDecisionRecord(requestBody,decision,source){
  if(!decision||typeof decision!=='object') return null;
  const summary=getMotorDecisionSummary(decision);
  return {
    session_id: SESSION_ID,
    lead_id: requestBody&&requestBody.lead_id?requestBody.lead_id:(LEAD&&LEAD._id?LEAD._id:null),
    created_at: new Date().toISOString(),
    trilha: T||null,
    route_label: requestBody&&requestBody.route?requestBody.route:(T==='de'?'Alemanha':'Austrália'),
    score: requestBody&&typeof requestBody.score==='number'?requestBody.score:null,
    banda: requestBody&&requestBody.band?requestBody.band:null,
    decision_status: summary?summary.status:null,
    recommended_offer: summary?summary.recommendedOffer:null,
    next_step: summary?summary.nextStep:null,
    source: source||null,
    request_payload: requestBody||{},
    decision_payload: decision
  };
}

async function requestMotorDecision(result,band){
  const cfg=getDossierMotorConfig();
  const requestBody=buildMotorRequest(result,band);
  if(!cfg.enabled||!cfg.decisionUrl){
    if(!requestBody){
      if(result&&result.final>=55) return {decision:getStoredMotorDecision(),source:'awaiting_intake'};
      return {decision:getStoredMotorDecision(),source:'stored_or_disabled'};
    }
    const decision=decideDossierInBrowser(requestBody);
    storeMotorDecision(decision);
    const decisionRecord=buildDossierDecisionRecord(requestBody,decision,'browser_fallback');
    if(decisionRecord) supabaseInsert('dossierDecisions', decisionRecord);
    logEvent('dossier_decision_received',{
      decision_status: decisionRecord?decisionRecord.decision_status:null,
      recommended_offer: decisionRecord?decisionRecord.recommended_offer:null,
      next_step: decisionRecord?decisionRecord.next_step:null,
      motor_source:'browser_fallback'
    });
    return {decision,source:'browser_fallback'};
  }

  if(!requestBody) return {decision:getStoredMotorDecision(),source:'awaiting_intake'};

  const controller=typeof AbortController!=='undefined' ? new AbortController() : null;
  const timeoutId=controller ? setTimeout(()=>controller.abort(), cfg.timeoutMs) : null;
  try{
    const res=await fetch(cfg.decisionUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(requestBody),
      signal:controller?controller.signal:undefined
    });
    if(timeoutId) clearTimeout(timeoutId);
    if(!res.ok) throw new Error(`Motor HTTP ${res.status}`);
    const decision=await res.json();
    storeMotorDecision(decision);
    const decisionRecord=buildDossierDecisionRecord(requestBody,decision,'remote');
    if(decisionRecord) supabaseInsert('dossierDecisions', decisionRecord);
    logEvent('dossier_decision_received',{
      decision_status: decisionRecord?decisionRecord.decision_status:null,
      recommended_offer: decisionRecord?decisionRecord.recommended_offer:null,
      next_step: decisionRecord?decisionRecord.next_step:null,
      motor_source:'remote'
    });
    return {decision,source:'remote'};
  }catch(e){
    if(timeoutId) clearTimeout(timeoutId);
    logEvent('dossier_decision_error',{motor_source:'fallback_after_error',error:e&&e.message?e.message:String(e)});
    const decision=requestBody?decideDossierInBrowser(requestBody):getStoredMotorDecision();
    if(decision&&requestBody){
      storeMotorDecision(decision);
      const decisionRecord=buildDossierDecisionRecord(requestBody,decision,'browser_fallback_after_error');
      if(decisionRecord) supabaseInsert('dossierDecisions', decisionRecord);
    }
    return {decision,source:'fallback_after_error',error:e&&e.message?e.message:String(e)};
  }
}

function safeUuid(prefix){
  return (typeof crypto!=='undefined'&&crypto.randomUUID) ? crypto.randomUUID() : `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2)}`;

    return id;
  }catch(e){

}

async function supabaseInsert(tableKey, record){
  const sb=APP_CONFIG.integrations.supabase;
  if(!sb.enabled||!sb.url||!sb.anonKey) return {ok:false, skipped:true, reason:'disabled_or_missing_config'};
  const table=sb.tables[tableKey];
  if(!table) return {ok:false, skipped:true, reason:'unknown_table'};
  try{
    const res = await fetch(`${sb.url.replace(/\/$/,'')}/rest/v1/${table}`,{
      method:'POST',
      headers:{
        apikey: sb.anonKey,
        Authorization: `Bearer ${sb.anonKey}`,
        'Content-Type':'application/json',
        Prefer:'return=minimal'
      },
      body:JSON.stringify(record)
    });
    const result={ok:res.ok||res.status===409,status:res.status,tableKey};
    window.__CIA_LAST_SUPABASE_RESULT__=result;
    if(!result.ok) console.warn('Supabase insert failed', tableKey, res.status);
    return result;
  }catch(e){
    const result={ok:false,status:null,tableKey,error:e&&e.message?e.message:String(e)};
    window.__CIA_LAST_SUPABASE_RESULT__=result;
    console.warn('Supabase insert skipped/error', tableKey, e);
    return result;
  }
}

async function logEvent(type, data={}){
  const payload = {
    ...baseTrackingContext(),
    type,
    ts: new Date().toISOString(),
    app_version: APP_CONFIG.version,
    lead_id: LEAD&&LEAD._id?LEAD._id:null,
    trilha: T || null,
    step,
    ...data
  };
  debugLog('[CIA App]', type, payload);
  if(type==='app_loaded'){
    supabaseInsert('sessions', {session_id:payload.session_id,app_version:APP_CONFIG.version,landing_path:payload.path,referrer:payload.referrer,utm:payload.utm});
  }
  supabaseInsert('events', {session_id:payload.session_id,lead_id:payload.lead_id,ts:payload.ts,type,app_version:APP_CONFIG.version,trilha:payload.trilha,step:payload.step,payload});
  if(!SHEETS_URL) return;
  try {
    await fetch(SHEETS_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    return;
  } catch(e){}
  try {
    const params=encodeURIComponent(JSON.stringify(payload));
    const img=new Image();
    img.src=SHEETS_URL+'?data='+params;
  } catch(e){ console.warn('Sheets fallback error', e); }
}

async function runSupabaseDiagnostic(opts={}){
  const allowWrite=!!opts.allowWrite;
  const sb=APP_CONFIG.integrations.supabase;
  if(!sb.enabled||!sb.url||!sb.anonKey){
    return {ok:false,stage:'config',message:'Supabase desativado ou com config incompleta.'};
  }

  const baseUrl=sb.url.replace(/\/$/,'');
  try{
    const pingRes=await fetch(`${baseUrl}/rest/v1/${sb.tables.sessions}?select=session_id&limit=1`,{
      method:'GET',
      headers:{apikey:sb.anonKey,Authorization:`Bearer ${sb.anonKey}`}
    });
    if(!pingRes.ok){
      return {ok:false,stage:'read_probe',status:pingRes.status,message:`Leitura de diagnóstico falhou (${pingRes.status}).`};
    }
  }catch(e){
    return {ok:false,stage:'reachability',message:`API inacessível: ${e&&e.message?e.message:String(e)}`};
  }

  if(!allowWrite){
    return {ok:true,stage:'read_probe',message:'API alcançável e config carregada. Teste de escrita não executado.'};
  }

  const smokeId=`qa_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const insertResult=await supabaseInsert('events',{
    session_id: SESSION_ID,
    lead_id: LEAD&&LEAD._id?LEAD._id:null,
    ts: new Date().toISOString(),
    type: 'qa_connectivity_check',
    app_version: APP_CONFIG.version,
    trilha: T||null,
    step,
    payload:{smoke_id:smokeId,source:'qa_panel'}
  });

  if(insertResult&&insertResult.ok){
    return {ok:true,stage:'write_probe',status:insertResult.status,message:'Escrita de teste aprovada no Supabase.'};
  }

  if(insertResult&&insertResult.status===401){
    return {ok:false,stage:'write_probe',status:401,message:'Escrita bloqueada por RLS. Verifique se as migrations/policies do Supabase foram aplicadas neste projeto.'};
  }

  return {ok:false,stage:'write_probe',status:insertResult&&insertResult.status?insertResult.status:null,message:`Escrita de teste falhou${insertResult&&insertResult.status?` (${insertResult.status})`:''}.`};
}

function bindQaCard(){
  if(!QA_MODE) return;
  const statusEl=document.getElementById('qa-status');
  const runCheck=async allowWrite=>{
    if(!statusEl) return;
    statusEl.className='qa-status';
    statusEl.textContent=allowWrite ? 'Rodando teste de escrita real...' : 'Rodando teste de conectividade...';
    const result=await runSupabaseDiagnostic({allowWrite});
    statusEl.className=`qa-status ${result.ok?'ok':(result.stage==='write_probe'?'err':'warn')}`;
    statusEl.textContent=[
      result.message,
      result.status?`HTTP: ${result.status}`:'',
      `Etapa: ${result.stage}`
    ].filter(Boolean).join('\n');
  };
  const readBtn=document.getElementById('qa-run-read');
  const writeBtn=document.getElementById('qa-run-write');
  if(readBtn) readBtn.addEventListener('click',()=>runCheck(false));
  if(writeBtn) writeBtn.addEventListener('click',()=>runCheck(true));
}

/* ---- proxy via Apps Script (chave Brevo nunca exposta no frontend) ---- */
async function _gasPost(payload){
  try{
    await fetch(SHEETS_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
  }catch(e){}
  // fallback query string (garante entrega com no-cors)
  try{
    const img=new Image();
    img.src=SHEETS_URL+'?data='+encodeURIComponent(JSON.stringify(payload));
  }catch(e){console.warn('GAS email fallback error:',e);}
}

async function _sendBrevo(toEmail,toName,subject,htmlContent){
  await _gasPost({type:'send_email',to:toEmail,toName,subject,html:htmlContent});
}

async function _sendBrevoScheduled(toEmail,toName,subject,htmlContent,delayMinutes){
  const dt=new Date(Date.now()+delayMinutes*60*1000);
  const scheduledAt=dt.toISOString().replace(/\.\d{3}Z$/,'Z');
  await _gasPost({type:'send_email',to:toEmail,toName,subject,html:htmlContent,scheduledAt});
}

async function _addContactBrevo(email,nome,score,banda,trilha){
  await _gasPost({type:'add_contact',email,nome,score,banda,trilha});
}

/* ---- gatilho principal ---- */
async function dispararEmailsLead(email,nome,score,trilha,alemao){
  if(!email||!nome)return;
  const firstName=String(nome||'').trim().split(/\s+/)[0]||'';
  const band=score<=40?'Explorador':score<=65?'Em Rota':score<=85?'Pronto para Embarcar':'Elite';
  const routeCfg=APP_CONFIG.email.routes[trilha]||{enabled:false,status:'plugin_missing'};

  // 1. Cadastra contato na lista Brevo (sempre, independente de banda)
  await _addContactBrevo(email,nome,score,band,trilha);

  if(!routeCfg.enabled){
    await _gasPost({type:'email_plugin_pending',email,nome,score,banda:band,trilha,status:routeCfg.status});
    logEvent('email_plugin_pending',{email,trilha,score,banda:band,status:routeCfg.status});
    return;
  }

  // 2. Sequência de emails por banda
  if(trilha==='de'){
    const alV=ANS['p2']?ANS['p2'].v:0;
    const temAlemao=alV>=2;

    if(score<=40){
      // Explorador: E1 + E2 + E3 com delays
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_DE(nome,score,band));
      await _sendBrevoScheduled(email,firstName,
        temAlemao?'Seu gargalo não é o idioma':'O primeiro travamento de quem quer trabalhar na Alemanha',
        _renderE2_DE(nome,temAlemao),E2_DELAY_MIN);
      await _sendBrevoScheduled(email,firstName,'Seu diploma brasileiro tem valor na Alemanha?',
        _renderE3_DE(nome),E3_DELAY_MIN);

    } else if(score<=65){
      // Em Rota: E1 imediato + E2 em 2 dias (posicionamento)
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_DE(nome,score,band));
      await _sendBrevoScheduled(email,firstName,'O que está travando sua candidatura alemã',
        _renderE2EmRota_DE(nome),E2_DELAY_MIN);

    } else if(score<=85){
      // Pronto Embarcar: E1 imediato + E2 em 2 dias (mentoria/próximo passo)
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_DE(nome,score,band));
      await _sendBrevoScheduled(email,firstName,'Você está mais perto do que imagina',
        _renderE2ProntoEmbarcar_DE(nome),E2_DELAY_MIN);

    } else {
      // Elite: só E1 imediato (CTA direto para LinkedIn)
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_DE(nome,score,band));
    }

  } else {
    if(score<=40){
      // Explorador: E1 + E2 + E3 com delays
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_AU(nome,score,band));
      await _sendBrevoScheduled(email,firstName,'Inglês profissional vs. inglês de sobrevivência',
        _renderE2_AU(nome),E2_DELAY_MIN);
      await _sendBrevoScheduled(email,firstName,'Como funciona o sistema de vistos australiano',
        _renderE3_AU(nome),E3_DELAY_MIN);

    } else if(score<=65){
      // Em Rota: E1 imediato + E2 em 2 dias (posicionamento)
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_AU(nome,score,band));
      await _sendBrevoScheduled(email,firstName,'Por que perfis qualificados não passam do filtro australiano',
        _renderE2EmRota_AU(nome),E2_DELAY_MIN);

    } else if(score<=85){
      // Pronto Embarcar: E1 imediato + E2 em 2 dias (visibilidade estratégica)
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_AU(nome,score,band));
      await _sendBrevoScheduled(email,firstName,'Perfil competitivo. O próximo passo é aparecer para as empresas certas',
        _renderE2ProntoEmbarcar_AU(nome),E2_DELAY_MIN);

    } else {
      // Elite: só E1 imediato (CTA direto para LinkedIn)
      await _sendBrevo(email,firstName,`${firstName}, seu resultado no CIA App está aqui`,_renderE1_AU(nome,score,band));

}

/* SCORE */
function calcScore(){
  const dims={d1:{pts:0,max:0},d2:{pts:0,max:0},d3:{pts:0,max:0},d4:{pts:0,max:0}};
  const W={d1:.30,d2:.25,d3:.25,d4:.20};
  QS.forEach(q=>{
    if(!q.opts||q.familyQ) return;
    const rec=ANS[q.id];
    const v=rec?(typeof rec.v==='number'?rec.v:0):0;
    const maxV=q.opts.filter(o=>typeof o.v==='number').reduce((m,o)=>Math.max(m,o.v),0);
    if(maxV>0){dims[q.dim].pts+=v;dims[q.dim].max+=maxV;}
  });
  const tf=CTR.adultos+CTR.criancas+CTR.jovens;
  if(tf>0) dims.d2.pts=Math.max(0,dims.d2.pts-Math.min(tf*1.2,5)*0.4);
  const geoPais=GEO.pais||'br';
  const geoTempoVal=GEO.tempo||'';
  const noDestino=(T==='de'&&geoPais==='de')||(T==='au'&&geoPais==='au');
  if(noDestino){
    const tempoBonus={lt6m:0.5,'6m1y':1,'1y2y':1.5,'2y5y':2,gt5y:2.5}[geoTempoVal]||0;
    dims.d2.pts=Math.min(dims.d2.max, dims.d2.pts+tempoBonus);
  }
  else if(geoPais&&geoPais!=='br'){
    dims.d2.pts=Math.min(dims.d2.max, dims.d2.pts+0.3);
  }
  const dS={};let tot=0;
  Object.keys(dims).forEach(d=>{
    const s=dims[d].max>0?Math.round((dims[d].pts/dims[d].max)*100):0;
    dS[d]=s;tot+=s*W[d];
  });
  return{final:Math.round(Math.min(100,Math.max(0,tot))),dims:dS};
}

    I('d2','Você já está lá: foco em posicionamento local',posLocal);
  }

  if(sc<=40){
    const inv40=ANS['p9']?ANS['p9'].v:0;
    let g40=jaNoDestino
      ?`Você já deu o passo mais difícil. Mas estar no país não garante emprego na área: a transição profissional exige uma camada adicional de preparação que muitos subestimam. Identifique o principal gap entre as quatro dimensões e trate como prioridade única nos próximos 60 dias.`
      :`Sua pontuação indica que uma mudança imediata <strong>aumenta consideravelmente o risco de fracasso</strong>. O problema raramente é falta de talento: é falta de preparação estratégica. Dependendo do seu ponto de partida, 12 a 24 meses de preparação focada é o horizonte realista para uma entrada bem posicionada.${refId}`;

  }
  else if(sc>=86) I('geral','Perspectiva geral: perfil pronto, foco em execução',`Sua pontuação está <strong>entre as mais competitivas</strong> desta avaliação. Nesse nível, o que separa quem consegue em semanas de quem demora meses não é mais preparação: é como você aparece para o mercado certo. Perfil no LinkedIn calibrado para recrutadores ${T==='de'?'alemães':'australianos'}, rede ativa no destino e candidaturas cirúrgicas nas empresas certas. Três movimentos. Execute um por vez.`);
  else if(sc>=66){
    const ingBom=T==='au'&&en>=2;
    const alBom=T==='de'&&typeof al==='number'&&al>=2;
    const idiomaOk=ingBom||alBom;
    const gap66=idiomaOk?'posicionamento e visibilidade no mercado-alvo':'idioma ou posicionamento';
    const foco66=idiomaOk
      ?`Seu idioma já não é o obstáculo. O que vai fazer a diferença agora é <strong>como você aparece para recrutadores antes de candidatar</strong>: LinkedIn otimizado para o mercado ${T==='de'?'alemão':'australiano'}, rede de contatos ativa no destino e um currículo que comunica valor internacional, não apenas experiência local. Escolha um desses três e execute com foco nos próximos 90 dias.`
      :`Você está na direção certa. Escolha <strong>um único gap para os próximos 90 dias</strong> e execute com foco. Corrija primeiro o ${gap66} e o nível de competitividade sobe de forma significativa.`;
    I('geral','Perspectiva geral: refine e avance',foco66);
  }
  else I('geral','Perspectiva geral: ajuste fino antes do salto',`Você está na direção certa. <strong>Identifique o principal gap entre as quatro dimensões</strong> e trate como prioridade única. ${jaNoDestino?'Quem já está no destino com o perfil certo não precisa de meses: precisa de foco nas ações certas.':'Foco e consistência nos próximos meses separam quem chega posicionado de quem chega recomeçando do zero.'}`);
  return R;
}

function getSteps(result){
  const sc=result.final;
  const en=ANS['p1']?ANS['p1'].v:0;
  const al=ANS['p2']?ANS['p2'].v:0;
  const inglesInsuf=T==='au'&&en<=1;
  const alemaoInsuf=T==='de'&&typeof al==='number'&&al<2;

    ?`<a href="${CURSO_ALEMAO}" target="_blank">Invista num curso de alemão estruturado</a> e defina B2 como meta`
    :'Invista num curso de alemão estruturado e defina B2 como meta';

  const pacoteAU=p11v>=2?null:`Prepare seu pacote de candidatura no padrão australiano: ${appsPkg}`;
  const pacoteGen=p11v>=2?null:`Prepare seu pacote de candidatura: ${appsPkg}`;
  const liStep=p11v>=3?null:(APP_LI_URL
    ?`Otimize seu perfil no LinkedIn para recrutadores ${T==='de'?'alemães':'australianos'}: <a href="${APP_LI_URL}" target="_blank">ajuste headline, resumo e experiências</a> com palavras-chave do mercado local`
    :`Otimize seu perfil no LinkedIn para recrutadores ${T==='de'?'alemães':'australianos'}: ajuste headline, resumo e experiências com palavras-chave do mercado local`);
  const idiomaDE=`Priorize o Alemão antes de qualquer outra ação: ${cursol}. Sem B1 iniciado, a maioria das candidaturas não passa da triagem inicial`;

  /* FIX: step de inglês AU com VerbalizeNow */

  if(T==='de'){

      const p6ND=ANS['p6']?ANS['p6'].v:0;
      const p7ND=ANS['p7']?ANS['p7'].v:0;
      const jaAdaptouND=p11v>=2;
      const jaTemEntrevistasND=p7ND>=2;
      if(alemaoInsuf) return[
        idiomaDE,
        `Defina 5 empresas-alvo na sua área e pesquise a estrutura delas antes de candidatar`,
        `Construa rede ativa via Xing e LinkedIn com profissionais da sua área na Alemanha`
      ];
      if(jaAdaptouND&&jaTemEntrevistasND) return[
        p6ND>=2
          ?`Ative sua rede: contato direto com gestores e recrutadores via Xing e LinkedIn vale mais do que candidaturas em massa`
          :`Construa rede local ativa agora: conecte-se via Xing e LinkedIn com profissionais e recrutadores da sua área`,
        `Refine sua estratégia: selecione 5 a 10 empresas-alvo por porte e setor`,
        `Acompanhe vagas em <a href="https://www.stepstone.de" target="_blank">StepStone</a> e <a href="https://www.make-it-in-germany.com" target="_blank">Make it in Germany</a> como complemento ao networking`
      ];
      if(jaAdaptouND) return[
        `Seu material está pronto. Próximo passo: candidaturas direcionadas a 5 empresas-alvo bem escolhidas`,
        p6ND>=2
          ?`Ative sua rede via Xing: contato direto com gestores da sua área tem retorno muito maior do que portais de vagas`
          :`Construa rede ativa via Xing e LinkedIn. Com o material pronto, o limitante agora é visibilidade`,
        `Explore vagas em <a href="https://www.stepstone.de" target="_blank">StepStone</a> e <a href="https://www.make-it-in-germany.com" target="_blank">Make it in Germany</a>`
      ];
      return[
        `Otimize seu LinkedIn e currículo (Lebenslauf) para o padrão alemão: palavras-chave em alemão que os sistemas ATS locais reconhecem${APP_CV_URL?', disponível em: <a href="'+APP_CV_URL+'" target="_blank">use nosso otimizador</a>':''}`,
        ...(pacoteDE?[pacoteDE]:[]),
        `Explore vagas em <a href="https://www.make-it-in-germany.com" target="_blank">Make it in Germany</a>, <a href="https://www.stepstone.de" target="_blank">StepStone</a> e Xing`
      ];
    }
    if(sc<=40) return[
      alemaoInsuf?idiomaDE:'Verifique seu diploma em <a href="https://anabin.kmk.org" target="_blank">anabin.kmk.org</a> e inicie o processo de reconhecimento o quanto antes',
      alemaoInsuf?'Verifique seu diploma em <a href="https://anabin.kmk.org" target="_blank">anabin.kmk.org</a> em paralelo com o desenvolvimento do idioma':'Defina uma única prioridade para os próximos 90 dias e execute sem dispersão',
      'Construa uma rede de contatos com brasileiros que já estão na Alemanha na sua área: essa rede vai encurtar seu caminho mais do que qualquer curso'
    ];
    if(sc<=65) return[
      alemaoInsuf?idiomaDE:'Verifique seu diploma em <a href="https://anabin.kmk.org" target="_blank">anabin.kmk.org</a> e avance no processo de reconhecimento',
      ...(pacoteGen?[pacoteGen]:[]),
      ...(liStep?[liStep]:[])
    ];
    if(sc<=85) return[
      ...(pacoteGen?[pacoteGen]:[]),
      ...(liStep?[liStep]:[]),
      (()=>{
        const rede6=ANS['p6']?ANS['p6'].v:0;
        const area6=ANS['p3']?ANS['p3'].v:'outro';

        if(rede6>=2){

            ?'Priorize networking direto e Xing antes de job sites. Com rede ativa, candidaturas diretas convertem mais. Job sites como Make it in Germany e StepStone como complemento'
            :'Priorize contato direto com empresas-alvo antes de job sites. Com rede ativa, o retorno é maior. Use Make it in Germany e StepStone como complemento, não como estratégia principal';
        }
        // Se rede fraca: começar pelos canais mais acessíveis
        return 'Comece pelos canais de menor fricção: <a href="https://www.make-it-in-germany.com" target="_blank">Make it in Germany</a> e <a href="https://www.stepstone.de" target="_blank">StepStone</a> para mapear empresas, e construa rede ativa em paralelo. Networking e contato direto têm taxa de retorno muito maior';
      })()
    ];
    return[
      (()=>{
        const rede6e=ANS['p6']?ANS['p6'].v:0;
        const area6e=ANS['p3']?ANS['p3'].v:'outro';
        // Elite com rede forte: marketing pessoal e networking direto primeiro
        if(rede6e>=2){
          return 'Seu perfil já justifica abordagem direta: networking ativo com decisores na sua área e presença no LinkedIn/Xing que faz recrutadores te encontrarem. Candidaturas reativas em job sites são o canal de menor retorno para quem está no seu nível';

        return 'Comece a aplicar agora, mas com cirurgia: 5 a 10 empresas-alvo bem escolhidas valem mais do que 100 candidaturas em job sites. Construa rede ativa em paralelo. É o canal com maior taxa de conversão para perfis competitivos';
      })(),
      ...(pacoteGen?[pacoteGen]:[]),
      ...(liStep?[liStep]:[])
    ];
  }

  // AU
  if(isNoDestino()) return[
    inglesInsuf?idiomaAU:`Otimize seu perfil no LinkedIn para recrutadores australianos: headline, resumo e experiências com palavras-chave do mercado local${APP_LI_URL?', disponível em: <a href="'+APP_LI_URL+'" target="_blank">use nosso otimizador</a>':''}`,

  if(sc<=40) return[
    inglesInsuf?idiomaAU:`Consulte um agente de imigração registrado (MARA agent) para entender qual rota de visto se aplica ao seu perfil: <a href="https://immi.homeaffairs.gov.au" target="_blank">immi.homeaffairs.gov.au</a>`,

  ];
  if(sc<=65) return[
    inglesInsuf?idiomaAU:`Consulte um agente de imigração registrado (MARA agent) para entender qual rota se aplica ao seu perfil: <a href="https://immi.homeaffairs.gov.au" target="_blank">immi.homeaffairs.gov.au</a>`,
    ...(pacoteGen?[pacoteGen]:[]),
    ...(liStep?[liStep]:[])
  ];
  if(sc<=85) return[
    `Consulte um agente de imigração registrado (MARA agent) para entender qual rota se aplica ao seu perfil: <a href="https://immi.homeaffairs.gov.au" target="_blank">immi.homeaffairs.gov.au</a>`,
    ...(pacoteGen?[pacoteGen]:[]),
    ...(liStep?[liStep]:[])
  ];
  return[
    (()=>{
      const rede6au2=ANS['p6']?ANS['p6'].v:0;
      if(rede6au2>=2){
        return 'Seu perfil justifica abordagem direta: networking ativo com recrutadores e decisores na sua área vale mais do que candidaturas em mass. LinkedIn como canal principal. Ser encontrado passivamente é o nível mais eficiente para quem está no seu estágio';
      }
      return 'Comece a aplicar com foco: 5 a 10 empresas-alvo bem escolhidas no <a href="https://www.seek.com.au" target="_blank">Seek</a> e LinkedIn valem mais do que candidaturas em massa. Construa rede local em paralelo. É o canal com maior retorno para perfis competitivos';
    })(),
    ...(pacoteGen?[pacoteGen]:[]),
    ...(liStep?[liStep]:[])
  ];
}

function buildSummary(result,insights,steps){
  const b=getBand(result.final),a=ANS,tf=CTR.adultos+CTR.criancas+CTR.jovens;
  const dest=T==='de'?'Alemanha':'Austrália';
  const lines=[];
  lines.push('Career Intelligence Assessment · Elite Migration');
  lines.push('Trilha: '+dest);
  lines.push('');
  lines.push('Pontuação: '+result.final+'/100 · '+b.lb);
  lines.push(b.desc);
  lines.push('');
  lines.push('Área: '+(a['p3']?a['p3'].l:'não informado'));
  lines.push((T==='de'?'Alemão':'Inglês')+': '+(a['p2']?a['p2'].l:'não informado'));
  lines.push('Prazo: '+(a['p8']?a['p8'].l:'não informado'));
  if(tf>0) lines.push('Dependentes: '+tf+' pessoa'+(tf!==1?'s':''));
  lines.push('');
  lines.push('Pontuação por dimensão:');
  lines.push('  Idioma e área: '+result.dims.d1+'/100');
  lines.push('  Maturidade da decisão: '+result.dims.d2+'/100');
  lines.push('  Perfil comportamental: '+result.dims.d3+'/100');
  lines.push('  Conhecimento do mercado: '+result.dims.d4+'/100');
  if(insights&&insights.length){
    lines.push('');
    lines.push('Análise:');
    insights.forEach(i=>{
      const txt=i.text.replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
      lines.push('• '+i.title);
      lines.push('  '+txt);
    });
  }
  if(steps&&steps.length){
    lines.push('');
    lines.push('Próximos passos:');
    steps.forEach((s,i)=>{
      const txt=s.replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();
      lines.push((i+1)+'. '+txt);
    });
  }
  lines.push('');
  lines.push('---');
  lines.push('AVISO: Este relatório é exclusivamente informativo e educacional. Não constitui assessoria jurídica, de imigração, financeira ou profissional. '+(T==='au'?'Consulte um agente de imigração registrado (MARA agent) antes de tomar qualquer decisão.':'Consulte uma consultoria de imigração credenciada antes de tomar qualquer decisão.')+' Elite Migration não se responsabiliza por decisões tomadas com base exclusivamente neste conteúdo.');
  return lines.join('\n');
}
