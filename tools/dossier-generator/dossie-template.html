<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dossie Elite Migration</title>
<style>
  :root {
    --preto-noite: #0B1114;
    --champagne: #C9A46A;
    --cobre: #B87942;
    --texto-claro: #f2ede4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'DM Serif Display', serif;
    color: #1a1a1a;
    background: #ffffff;
  }
  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 22mm 18mm;
    page-break-after: always;
    position: relative;
  }
  .page:last-child { page-break-after: auto; }
  .capa {
    background: var(--preto-noite);
    color: var(--texto-claro);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }
  .capa .eyebrow {
    font-family: Arial, sans-serif;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--champagne);
    margin-bottom: 24px;
  }
  .capa h1 {
    font-size: 46px;
    line-height: 1.1;
    border-left: 3px solid var(--champagne);
    padding-left: 20px;
    margin-bottom: 16px;
  }
  .capa .subtitulo {
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: rgba(242,237,228,0.75);
    padding-left: 23px;
    max-width: 70%;
  }
  .capa .rodape-capa {
    position: absolute;
    bottom: 22mm;
    left: 18mm;
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: rgba(242,237,228,0.5);
  }
  .secao-header {
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cobre);
    border-bottom: 1px solid var(--champagne);
    padding-bottom: 8px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
  }
  p { font-size: 14px; line-height: 1.7; margin-bottom: 14px; }
  blockquote {
    border-left: 3px solid var(--champagne);
    padding-left: 18px;
    margin: 20px 0;
    font-style: italic;
    color: #333;
  }
  .contradicao {
    margin-bottom: 20px;
    padding: 14px 18px;
    background: #faf7f0;
    border-left: 3px solid var(--cobre);
  }
  .contradicao .titulo {
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cobre);
    margin-bottom: 6px;
  }
  table.salarial {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    font-family: Arial, sans-serif;
    font-size: 12.5px;
  }
  table.salarial th {
    background: var(--preto-noite);
    color: var(--champagne);
    padding: 10px 12px;
    text-align: left;
  }
  table.salarial td {
    padding: 9px 12px;
    border-bottom: 1px solid #eee;
  }
  .fonte-salarial {
    font-family: Arial, sans-serif;
    font-size: 10.5px;
    color: #888;
    margin-top: -8px;
  }
  ol.passos { padding-left: 0; list-style: none; }
  ol.passos li {
    display: flex;
    gap: 14px;
    margin-bottom: 16px;
  }
  ol.passos .numero {
    font-family: Arial, sans-serif;
    font-weight: bold;
    color: var(--champagne);
    font-size: 20px;
    min-width: 28px;
  }
  .rodape-secao {
    position: absolute;
    bottom: 15mm;
    left: 18mm;
    right: 18mm;
    background: var(--preto-noite);
    color: var(--champagne);
    font-family: Arial, sans-serif;
    font-size: 10px;
    padding: 10px 16px;
    text-align: center;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body></body>
</html>
